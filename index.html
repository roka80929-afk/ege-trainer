<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Тренажёр ЕГЭ по профильной математике"><title>Тренажёр ЕГЭ по профилю</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600&display=swap"><style>:root{color-scheme:light}body{margin:0}</style></head><body>
<style>
/* Layout: grid-paper desk. Home is a field of 12 numbered tiles (one per exam task); a task opens as a single worksheet column with a figure, the answer written in a bordered blank like the exam form, and an explanation drawer. */
:root{
  --bg:#EAEFF6; --grid:#D6DFEC; --surface:#FFFFFF; --soft:#E4EBF6;
  --ink:#0F1B33; --muted:#566682; --line:#C3CEDF;
  --accent:#1B4FD6; --accent-ink:#FFFFFF;
  --s1:#2a78d6; --s2:#eb6834;
  --ok:#14724A; --ok-bg:#DCF2E7; --bad:#B4281F; --bad-bg:#FBE2DF; --warn:#7A5300; --warn-bg:#FFF0CC;
  --font-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1424; --grid:#162036; --surface:#141D31; --soft:#1B2742;
  --ink:#E8EEF9; --muted:#93A3C0; --line:#2A3855;
  --accent:#7B9BFF; --accent-ink:#0B1226;
  --s1:#3987e5; --s2:#d95926;
  --ok:#5ED39B; --ok-bg:#12362A; --bad:#FF9A90; --bad-bg:#3A1C1F; --warn:#FFD27A; --warn-bg:#3A2D10;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1424; --grid:#162036; --surface:#141D31; --soft:#1B2742;
  --ink:#E8EEF9; --muted:#93A3C0; --line:#2A3855;
  --accent:#7B9BFF; --accent-ink:#0B1226;
  --s1:#3987e5; --s2:#d95926;
  --ok:#5ED39B; --ok-bg:#12362A; --bad:#FF9A90; --bad-bg:#3A1C1F; --warn:#FFD27A; --warn-bg:#3A2D10;
  color-scheme:dark}

*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.tag{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,6.5vw,46px);line-height:1.08;letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
.lead{margin:0;max-width:60ch;color:var(--muted)}

.summary{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:14px;color:var(--muted)}
.summary b{font-family:var(--font-mono);color:var(--ink);font-weight:700}

.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:18px 20px}
.cta strong{font-size:18px;font-weight:600}
.cta span{font-size:14px;opacity:.85}
.cta:hover{filter:brightness(1.07)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.tile{display:grid;gap:6px;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile:hover{border-color:var(--accent)}
.tile .row{display:flex;align-items:baseline;gap:12px}
.num{font-family:var(--font-mono);font-weight:700;font-size:28px;line-height:1;color:var(--accent)}
.name{font-weight:600;font-size:17px}
.meta{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.stat{font-family:var(--font-mono);font-size:12px;color:var(--muted)}

.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--bad)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sess{font-family:var(--font-mono);font-size:13px;color:var(--muted)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:18px;min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.chip{font-family:var(--font-mono);font-weight:700;font-size:13px;background:var(--ink);color:var(--surface);border-radius:4px;padding:3px 9px}
.tname{font-size:14px;color:var(--muted)}
.q{margin:0;font-size:clamp(18px,2.8vw,22px);line-height:1.7;overflow-wrap:anywhere}
.q sup,.q sub{line-height:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;line-height:1.2;font-size:.95em}
.fr i{font-style:normal;padding:0 .3em}
.fr i:first-child{border-bottom:1.5px solid currentColor}

.figbox{background:var(--soft);border-radius:10px;padding:10px;display:flex;justify-content:center;min-width:0}
.fig{width:100%;max-width:400px;height:auto;display:block}
.fig .sk{stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.fig .sa{stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.fig .sm{stroke:var(--muted);fill:none;stroke-width:1.2}
.fig .sg{stroke:var(--line);fill:none;stroke-width:1}
.fig .sd{stroke-dasharray:5 4}
.fig .fsft{fill:var(--surface)}
.fig .fa{fill:var(--accent);stroke:none}
.fig .fk{fill:var(--ink);stroke:none}
.fig .fm{fill:var(--muted);stroke:none}
.fig .fdim{fill:var(--line);stroke:none}
.fig .fac{fill:var(--accent);fill-opacity:.2;stroke:none}
.fig .tx{font:600 13px var(--font-body);fill:var(--ink)}
.fig .ta{font:700 13px var(--font-body);fill:var(--accent)}
.fig .tm{font:500 11px var(--font-mono);fill:var(--muted)}
.fig .tc{font:700 13px var(--font-mono);fill:var(--ink)}

.alab{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ansrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.blank{width:12ch;font-family:var(--font-mono);font-weight:700;font-size:26px;letter-spacing:.12em;text-align:center;
  background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:8px 10px}
.blank:disabled{opacity:1;background:var(--soft)}
.hint{font-size:13px;color:var(--muted);margin:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 22px;font-weight:600;min-height:48px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn.small{min-height:40px;padding:8px 16px;font-size:15px}

.fb{border-radius:8px;padding:12px 16px;font-weight:500}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.warn{background:var(--warn-bg);color:var(--warn)}
.fb b{font-family:var(--font-mono)}
.sol{background:var(--soft);border-radius:8px;padding:12px 16px;font-size:15px}
.sol .tag{display:block;margin-bottom:4px}

.exp{border:1.5px solid var(--line);border-radius:10px;padding:6px 18px 16px;font-size:15.5px;line-height:1.6}
.exp h4{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px;font-weight:700}
.exp p{margin:0}
.exp ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.exp .tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

.segs{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.seg{height:6px;border-radius:3px;background:var(--line)}
.seg.on{background:var(--accent)}
.seg.cur{background:var(--ink)}

.score{font-family:var(--font-display);font-weight:600;font-size:clamp(40px,10vw,72px);line-height:1;letter-spacing:-.02em}
.score small{font-size:.35em;color:var(--muted);letter-spacing:0}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line);padding:12px 0}
.item summary{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;cursor:pointer;list-style:none}
.item summary::-webkit-details-marker{display:none}
.item .n{font-family:var(--font-mono);font-weight:700;width:2.4ch}
.item .t{min-width:0;overflow-wrap:anywhere}
.item .r{font-family:var(--font-mono);font-size:13px;white-space:nowrap}
.item .r.ok{color:var(--ok)} .item .r.bad{color:var(--bad)}
.item .body{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item .ans{font-size:14px;color:var(--muted)}
.item .ans b{font-family:var(--font-mono);color:var(--ink)}
.item details.inner summary{display:block;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:4px 0}

.sec{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.sec h2{font-family:var(--font-display);font-weight:600;font-size:clamp(18px,3.4vw,24px);margin:0;letter-spacing:-.01em}
.sec span{font-size:13px;color:var(--muted)}
.ctas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.ctas .cta{flex-direction:column;align-items:flex-start;gap:4px}
.cta.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--accent)}
.cta.alt:hover{filter:none;background:var(--soft)}
.pts{font-family:var(--font-mono);font-size:12px;background:var(--soft);color:var(--ink);border-radius:4px;padding:2px 8px;white-space:nowrap}
.tile .row .pts{margin-left:auto}
.paper{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:12px 16px;font-size:15px}
.q.long{font-size:clamp(16.5px,2.5vw,20px);line-height:1.75}
.ansbox{background:var(--ok-bg);border-radius:8px;padding:12px 16px;font-size:16px;line-height:1.75;overflow-wrap:anywhere}
.ansbox .tag{display:block;margin-bottom:4px;color:var(--ok)}
.rubric{font-size:14.5px;line-height:1.6;border:1.5px dashed var(--line);border-radius:8px;padding:12px 16px}
.scorebtns{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{min-width:52px;min-height:48px;font-family:var(--font-mono);font-weight:700;font-size:18px;background:var(--surface);border:2px solid var(--line);border-radius:8px}
.sbtn:hover:not(:disabled){border-color:var(--accent)}
.sbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sbtn:disabled{cursor:default;opacity:.65}
.sbtn[aria-pressed="true"]:disabled{opacity:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.item .r.mid{color:var(--warn)}
.sol .figbox,.sheet .figbox{margin:0}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 16px;font-weight:600;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.legend{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
.pgroup{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px;border-bottom:1px solid var(--line)}
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px 8px}
.plist .pgroup:first-child{padding-top:12px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .num.sm{font-size:22px;min-width:2ch;text-align:right}
.pmid{display:flex;flex-direction:column;gap:6px;min-width:0}
.ptop{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.pill{font-family:var(--font-mono);font-size:11.5px;font-weight:700;border-radius:4px;padding:2px 8px;white-space:nowrap}
.pill.lv-good{background:var(--ok-bg);color:var(--ok)}
.pill.lv-mid{background:var(--warn-bg);color:var(--warn)}
.pill.lv-weak{background:var(--bad-bg);color:var(--bad)}
.pill.lv-none{background:var(--soft);color:var(--muted)}
.bar i.b-good{background:var(--ok)}
.bar i.b-mid{background:var(--warn)}
.bar i.b-weak{background:var(--bad)}
.spark{display:block;flex:none}
.spark .sp-good{fill:var(--ok)}
.spark .sp-mid{fill:var(--warn)}
.spark .sp-weak{fill:var(--bad)}
.spark .sp-n{fill:var(--line)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:18px 20px;line-height:1.6}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px 10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pc{width:100%;height:auto;display:block}
.pc .pg{stroke:var(--line);stroke-width:1}
.pc .pax{stroke:var(--muted);stroke-width:1}
.pc .pmax{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.pc text{font:500 11px var(--font-mono);fill:var(--muted)}
.pc .tv{fill:var(--ink);font-weight:700}
.pc .s1{fill:var(--s1)}
.pc .s2{fill:var(--s2)}
.pc .hit{fill:transparent}
.pc .bargrp:hover .s1,.pc .bargrp:hover .s2{filter:brightness(1.12)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.s1{background:var(--s1)}
.sw.s2{background:var(--s2)}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rtable{width:100%;border-collapse:collapse;font-size:14.5px}
.rtable th{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.rtable td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.rtable tr:last-child td{border-bottom:0}
.rtable td.tot{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script id="gens">
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=x=>Math.round(x*1e9)/1e9;
const N=n=>String(rnd(n)).replace('.',',').replace('-','−');
const sg=n=>n<0?' − '+N(-n):' + '+N(n);
const xs=n=>n===0?'x':'x'+sg(n);
const fr=(a,b)=>'<span class="fr"><i>'+a+'</i><i>'+b+'</i></span>';
const lg=b=>'log<sub>'+b+'</sub>';
const sgn=()=>Math.random()<.5?-1:1;
function poly(cs){let s='';cs.forEach(([c,v])=>{if(!c)return;const a=Math.abs(c);const body=(a===1&&v)?v:N(a)+v;if(!s)s=(c<0?'−':'')+body;else s+=(c<0?' − ':' + ')+body;});return s||'0';}

/* ---------- объяснение: что знать / как решать / частая ошибка ---------- */
const E=(know,steps,err)=>'<h4>Что нужно знать</h4><p>'+know+'</p><h4>Как решать</h4><ol>'+steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+(err?'<h4>Частая ошибка</h4><p>'+err+'</p>':'');

/* ---------- SVG-примитивы ---------- */
const f1=n=>Math.round(n*10)/10;
const SV=(w,h,inner)=>'<svg class="fig" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Рисунок к задаче">'+inner+'</svg>';
const L=(x1,y1,x2,y2,c='sk')=>'<line class="'+c+'" x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'"/>';
const PG=(pts,c='sk')=>'<polygon class="'+c+'" points="'+pts.map(p=>f1(p[0])+','+f1(p[1])).join(' ')+'"/>';
const PH=(d,c='sk')=>'<path class="'+c+'" d="'+d+'"/>';
const TX=(x,y,t,a='middle',c='tx')=>'<text class="'+c+'" x="'+f1(x)+'" y="'+f1(y)+'" text-anchor="'+a+'">'+t+'</text>';
const DTt=(x,y,r=3.5,c='fa')=>'<circle class="'+c+'" cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+r+'"/>';
const CI=(x,y,r,c='sk')=>'<circle class="'+c+'" cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r)+'"/>';
const EL=(x,y,rx,ry,c='sk')=>'<ellipse class="'+c+'" cx="'+f1(x)+'" cy="'+f1(y)+'" rx="'+f1(rx)+'" ry="'+f1(ry)+'"/>';
const RC=(x,y,w,h,c='sk',r=0)=>'<rect class="'+c+'" x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(w)+'" height="'+f1(h)+'" rx="'+r+'"/>';
const AR=(x1,y1,x2,y2,c='sa')=>{const th=Math.atan2(y2-y1,x2-x1),hl=9,hw=4.5;const bx=x2-hl*Math.cos(th),by=y2-hl*Math.sin(th);const px=-Math.sin(th)*hw,py=Math.cos(th)*hw;
  return L(x1,y1,bx,by,c)+'<polygon class="'+(c==='sa'?'fa':c==='sk'?'fk':'fm')+'" points="'+f1(x2)+','+f1(y2)+' '+f1(bx+px)+','+f1(by+py)+' '+f1(bx-px)+','+f1(by-py)+'"/>';};
const RA=(x,y,ux,uy,vx,vy,s=11)=>PH('M'+f1(x+ux*s)+' '+f1(y+uy*s)+'L'+f1(x+ux*s+vx*s)+' '+f1(y+uy*s+vy*s)+'L'+f1(x+vx*s)+' '+f1(y+vy*s));

/* ---------- планиметрия ---------- */
function triRight(ac,bc,ab,ratio,ang){
  let w,h;if(ratio<=1){w=230;h=Math.max(70,230*ratio);}else{h=150;w=Math.max(70,150/ratio);}
  const cx=50,cy=180,ax=cx+w,ay=cy,bx=cx,by=cy-h;
  let s=PG([[cx,cy],[ax,ay],[bx,by]],'sk fsft')+RA(cx,cy,1,0,0,-1);
  s+=TX(cx-12,cy+16,'C')+TX(ax+12,ay+16,'A')+TX(bx-14,by-2,'B');
  if(ac)s+=TX((cx+ax)/2,cy+20,ac);
  if(bc)s+=TX(cx-10,(cy+by)/2+4,bc,'end');
  if(ab){s+=TX((ax+bx)/2+10,(ay+by)/2-8,ab,'start');}
  if(ang){const len=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/len,uy=(by-ay)/len;
    s+=PH('M'+f1(ax-30)+' '+f1(ay)+'A30 30 0 0 1 '+f1(ax+30*ux)+' '+f1(ay+30*uy),'sa');}
  return SV(340,215,s);
}
function triCirc(ac,bc,ratio){
  let w,h;if(ratio<=1){w=160;h=Math.max(60,160*ratio);}else{h=120;w=Math.max(60,120/ratio);}
  const mx=170,my=125;const cx=mx-w/2,cy=my+h/2,ax=mx+w/2,ay=cy,bx=cx,by=my-h/2;const r=Math.hypot(w,h)/2;
  let s=CI(mx,my,r,'sk')+PG([[cx,cy],[ax,ay],[bx,by]],'sk fsft')+RA(cx,cy,1,0,0,-1)+DTt(mx,my,3);
  s+=TX(cx-12,cy+16,'C')+TX(ax+12,ay+16,'A')+TX(bx-14,by-4,'B')+TX((cx+ax)/2,cy+18,ac)+TX(cx-8,my+4,bc,'end')+TX(mx+8,my-8,'O','start','tm');
  return SV(340,260,s);
}
function inscribed(arc){

/* 1. Планиметрия */
const TR=[[3,4,5],[5,12,13],[8,15,17],[7,24,25]];
def(1,'Планиметрия','Треугольники, окружность, четырёхугольники',[
 ()=>{const [a,b,c]=pick(TR);const k=a===3?ri(1,5):ri(1,2);const A=a*k,B=b*k,C=c*k;
  return{q:`В прямоугольном треугольнике катеты равны ${A} и ${B}. Найдите гипотенузу.`,a:C,fig:triRight(String(A),String(B),'?',B/A),
   th:E('Теорема Пифагора: в прямоугольном треугольнике квадрат гипотенузы равен сумме квадратов катетов, c² = a² + b². Гипотенуза лежит напротив прямого угла и всегда самая длинная сторона.',['Определите, какие стороны катеты, а какая гипотенуза (на рисунке она отмечена знаком вопроса).','Возведите оба катета в квадрат и сложите результаты.','Извлеките квадратный корень из суммы.'],'Нельзя складывать сами катеты: сначала квадраты, потом корень. Полезно помнить «египетские» тройки 3-4-5, 5-12-13, 8-15-17, 7-24-25 и числа, кратные им: в такой задаче корень извлекается нацело.'),
   sol:`По теореме Пифагора гипотенуза равна √(${A*A} + ${B*B}) = √${C*C} = ${C}.`};},
 ()=>{const k=ri(1,6),t=ri(0,2);
  const th=E('В прямоугольном треугольнике для острого угла A: sin A = противолежащий катет : гипотенуза, cos A = прилежащий катет : гипотенуза, tg A = противолежащий катет : прилежащий катет. Противолежащий катет — тот, что не касается вершины A.',['Нарисуйте треугольник и отметьте угол A (дуга на рисунке).','Выясните, какая сторона противолежит углу A, какая прилежит, и найдите недостающую по теореме Пифагора.','Составьте нужное отношение сторон и сократите дробь.','Запишите ответ десятичной дробью.'],'Путают прилежащий и противолежащий катеты. Проверка: синус и косинус острого угла всегда меньше 1, так как катет короче гипотенузы.');
  if(t===0)return{q:`В треугольнике ABC угол C равен 90°, AC = ${4*k}, AB = ${5*k}. Найдите sin A.`,a:.6,fig:triRight(String(4*k),'',String(5*k),.75,true),th,sol:`BC = √(${25*k*k} − ${16*k*k}) = ${3*k}. sin A = BC : AB = ${3*k} : ${5*k} = 0,6.`};
  if(t===1)return{q:`В треугольнике ABC угол C равен 90°, BC = ${3*k}, AB = ${5*k}. Найдите cos A.`,a:.8,fig:triRight('',String(3*k),String(5*k),.75,true),th,sol:`AC = √(${25*k*k} − ${9*k*k}) = ${4*k}. cos A = AC : AB = ${4*k} : ${5*k} = 0,8.`};
  return{q:`В треугольнике ABC угол C равен 90°, AC = ${4*k}, BC = ${3*k}. Найдите tg A.`,a:.75,fig:triRight(String(4*k),String(3*k),'',.75,true),th,sol:`tg A = BC : AC = ${3*k} : ${4*k} = 0,75.`};},
 ()=>{const arc=2*ri(20,160);
  return{q:`Дуга AC окружности, не содержащая точки B, равна ${arc}°. Найдите вписанный угол ABC. Ответ дайте в градусах.`,a:arc/2,fig:inscribed(arc),
   th:E('Вписанный угол — угол, вершина которого лежит на окружности, а стороны пересекают её. Он равен половине дуги, на которую опирается. Центральный угол (вершина в центре) равен самой дуге.',['Найдите дугу, на которую опирается угол ABC: это дуга AC, внутри которой нет вершины B (она выделена цветом).','Разделите её градусную меру на 2.'],'Берут дугу с другой стороны или забывают разделить на 2. Если дуга больше 180°, вписанный угол всё равно равен её половине (получится тупой угол).'),
   sol:`Вписанный угол равен половине дуги, на которую опирается: ${arc}° : 2 = ${arc/2}°.`};},
 ()=>{const a=ri(2,20);let b=ri(2,20);while(b===a)b=ri(2,20);
  return{q:`Основания трапеции равны ${a} и ${b}. Найдите среднюю линию трапеции.`,a:(a+b)/2,fig:trapezoid(a,b),
   th:E('Средняя линия трапеции соединяет середины боковых сторон. Она параллельна основаниям и равна их полусумме: m = (a + b) : 2.',['Определите основания: это две параллельные стороны.','Сложите их длины.','Разделите сумму на 2. Результат лежит между длинами оснований.'],'Подставляют в формулу боковые стороны. Они в этой задаче не нужны.'),
   sol:`Средняя линия равна полусумме оснований: (${a} + ${b}) : 2 = ${N((a+b)/2)}.`};},
 ()=>{const d1=ri(4,20),d2=ri(4,20);
  return{q:`Диагонали ромба равны ${d1} и ${d2}. Найдите его площадь.`,a:d1*d2/2,fig:rhombus(d1,d2),
   th:E('Диагонали ромба перпендикулярны и делят его на четыре равных прямоугольных треугольника. Площадь ромба равна половине произведения диагоналей: S = d₁·d₂ : 2.',['Перемножьте длины диагоналей.','Разделите произведение на 2.'],'Забывают делить на 2. Произведение диагоналей — площадь прямоугольника, в который ромб вписан, а ромб занимает ровно половину.'),
   sol:`Площадь ромба равна половине произведения диагоналей: ${d1}·${d2} : 2 = ${N(d1*d2/2)}.`};},
 ()=>{const k=ri(1,6);
  return{q:`Катеты прямоугольного треугольника равны ${3*k} и ${4*k}. Найдите радиус описанной около него окружности.`,a:2.5*k,fig:triCirc(String(4*k),String(3*k),.75),
   th:E('Прямой вписанный угол опирается на диаметр. Поэтому центр окружности, описанной около прямоугольного треугольника, лежит на середине гипотенузы, а радиус равен половине гипотенузы: R = c : 2.',['Найдите гипотенузу по теореме Пифагора (здесь работает тройка 3-4-5).','Разделите гипотенузу на 2.'],'Берут радиус равным гипотенузе или большему катету. Гипотенуза — это диаметр.'),
   sol:`Гипотенуза равна ${5*k}. Центр описанной окружности лежит на середине гипотенузы, поэтому R = ${5*k} : 2 = ${N(2.5*k)}.`};},
 ()=>{const x=2*ri(10,70);
  return{q:`В равнобедренном треугольнике угол при вершине равен ${x}°. Найдите угол при основании. Ответ дайте в градусах.`,a:(180-x)/2,fig:isosceles(x),
   th:E('Сумма углов треугольника равна 180°. В равнобедренном треугольнике углы при основании равны между собой.',['Вычтите угол при вершине из 180°. Получится сумма двух углов при основании.','Разделите остаток пополам.'],'Вычитают угол из 90° или забывают разделить пополам.'),
   sol:`Сумма углов треугольника 180°, углы при основании равны. (180° − ${x}°) : 2 = ${(180-x)/2}°.`};},
 ()=>{const a=ri(3,20),h=ri(3,20);
  return{q:`Сторона треугольника равна ${a}, высота, проведённая к ней, равна ${h}. Найдите площадь треугольника.`,a:a*h/2,fig:triHeight(a,h),
   th:E('Площадь треугольника равна половине произведения стороны на высоту, проведённую к этой стороне: S = ½·a·h. Высота перпендикулярна стороне (на рисунке отмечен прямой угол).',['Убедитесь, что высота проведена именно к данной стороне.','Перемножьте сторону и высоту.','Разделите на 2.'],'Умножают сторону на другую сторону вместо высоты, а также забывают делить на 2.'),
   sol:`S = ½·${a}·${h} = ${N(a*h/2)}.`};},
 ()=>{const [a,b,c]=pick(TR);const k=a===3?ri(1,4):ri(1,2);
  return{q:`В прямоугольном треугольнике один из катетов равен ${a*k}, а гипотенуза равна ${c*k}. Найдите площадь треугольника.`,a:a*b*k*k/2,fig:triRight(String(a*k),'?',String(c*k),b/a),
   th:E('Площадь прямоугольного треугольника равна половине произведения катетов, потому что один катет можно считать основанием, а другой — высотой. Недостающий катет находится по теореме Пифагора: a² = c² − b².',['Найдите второй катет: из квадрата гипотенузы вычтите квадрат известного катета и извлеките корень.','Вычислите ½·(катет)·(катет).'],'Умножают катет на гипотенузу. Гипотенуза в формуле площади не участвует.'),
   sol:`Второй катет равен √(${(c*k)**2} − ${(a*k)**2}) = ${b*k}. Площадь: ½·${a*k}·${b*k} = ${N(a*b*k*k/2)}.`};}
]);

/* 2. Векторы */
const VT=[[3,4,5],[6,8,10],[5,12,13],[8,6,10],[12,5,13],[15,8,17],[9,12,15],[4,3,5]];
def(2,'Векторы','Координаты, длина, скалярное произведение',[
 ()=>{const x1=ri(-6,6),y1=ri(-6,6),x2=ri(-6,6),y2=ri(-6,6);const r=x1*x2+y1*y2;
  return{q:`Даны векторы a(${N(x1)}; ${N(y1)}) и b(${N(x2)}; ${N(y2)}). Найдите скалярное произведение a·b.`,a:r,fig:figDot(x1,y1,x2,y2),
   th:E('Скалярное произведение векторов a(x₁; y₁) и b(x₂; y₂) равно x₁·x₂ + y₁·y₂. Результат — число, а не вектор.',['Перемножьте первые координаты.','Перемножьте вторые координаты.','Сложите два произведения, аккуратно считая знаки.'],'Ошибки в знаках: произведение двух отрицательных чисел положительно, а положительного и отрицательного — отрицательно.'),
   sol:`a·b = x₁x₂ + y₁y₂ = ${N(x1)}·${N(x2)} + ${N(y1)}·${N(y2)} = ${N(r)}.`};},
 ()=>{const [u,v,l]=pick(VT);const su=sgn()*u,sv=sgn()*v;const x1=ri(-7,7),y1=ri(-7,7);const x2=su-x1,y2=sv-y1;
  return{q:`Даны векторы a(${N(x1)}; ${N(y1)}) и b(${N(x2)}; ${N(y2)}). Найдите длину вектора a + b.`,a:l,fig:figSum(x1,y1,x2,y2),
   th:E('При сложении векторов складываются их соответствующие координаты: a + b = (x₁ + x₂; y₁ + y₂). Длина вектора (u; v) равна √(u² + v²). На рисунке сумма — диагональ параллелограмма, построенного на векторах.',['Найдите координаты a + b.','Возведите обе координаты суммы в квадрат и сложите.','Извлеките корень.'],'Складывают длины векторов вместо координат: |a + b| не равно |a| + |b|.'),
   sol:`a + b = (${N(su)}; ${N(sv)}). Длина: √(${u*u} + ${v*v}) = √${l*l} = ${l}.`};},
 ()=>{const [u,v,l]=pick(VT);const x1=ri(-6,6),y1=ri(-6,6);const x2=x1+sgn()*u,y2=y1+sgn()*v;
  return{q:`Найдите длину вектора AB, если A(${N(x1)}; ${N(y1)}) и B(${N(x2)}; ${N(y2)}).`,a:l,fig:figAB(x1,y1,x2,y2),
   th:E('Координаты вектора AB равны координатам конца минус координаты начала: AB = (x_B − x_A; y_B − y_A). Длина вектора — это расстояние между точками, √(u² + v²). Пунктирные катеты на рисунке — это приращения по x и по y.',['Вычтите координаты начала из координат конца.','Возведите полученные числа в квадрат и сложите.','Извлеките корень из суммы.'],'Вычитают в обратном порядке (A − B). На длину это не влияет, но координаты вектора получаются с обратными знаками.'),
   sol:`AB = (${N(x2-x1)}; ${N(y2-y1)}). Длина: √(${u*u} + ${v*v}) = ${l}.`};},
 ()=>{const [m,n]=pick([[2,3],[3,2],[2,1],[3,1],[1,2],[4,1]]);const x1=ri(-5,5),y1=ri(-5,5),x2=ri(-5,5),y2=ri(-5,5);
  const cx=m*x1-n*x2,cy=m*y1-n*y2;
  return{q:`Даны векторы a(${N(x1)}; ${N(y1)}) и b(${N(x2)}; ${N(y2)}). Найдите сумму координат вектора ${m===1?'':m}a − ${n===1?'':n}b.`,a:cx+cy,fig:figLin(x1,y1,x2,y2,m,n),
   th:E('При умножении вектора на число умножаются обе его координаты. При вычитании векторов вычитаются соответствующие координаты: m·a − n·b = (m·x₁ − n·x₂; m·y₁ − n·y₂).',['Умножьте координаты a на первое число, координаты b на второе.','Вычтите координаты по парам и получите вектор.','Сложите две координаты получившегося вектора.'],'Умножают на число только одну координату или забывают, что вычитание меняет знаки у обеих координат b.'),
   sol:`${m===1?'':m}a − ${n===1?'':n}b = (${N(cx)}; ${N(cy)}). Сумма координат: ${N(cx+cy)}.`};},
 ()=>{const m=ri(2,10),n=ri(2,10),ang=pick([60,120]);const r=ang===60?m*n/2:-m*n/2;
  return{q:`Длины векторов a и b равны ${m} и ${n}, угол между ними равен ${ang}°. Найдите скалярное произведение a·b.`,a:r,fig:figAngle(m,n,ang),
   th:E('Скалярное произведение через длины и угол: a·b = |a|·|b|·cos φ. Значения косинуса: cos 60° = 0,5, cos 120° = −0,5 (косинус тупого угла отрицателен).',['Определите косинус заданного угла.','Перемножьте длины векторов.','Умножьте произведение длин на косинус.'],'Берут sin вместо cos или забывают, что для тупого угла результат отрицателен.'),
   sol:`a·b = |a|·|b|·cos ${ang}° = ${m}·${n}·${ang===60?'0,5':'(−0,5)'} = ${N(r)}.`};}
]);

const BX=[[2,3,6,7],[1,4,8,9],[2,10,11,15],[4,4,7,9],[6,6,7,11],[2,6,9,11],[1,2,2,3]];
def(3,'Стереометрия','Объёмы и площади, диагонали',[
 ()=>{const a=ri(2,7);return{q:`Объём куба равен ${a**3}. Найдите площадь его поверхности.`,a:6*a*a,fig:cuboid('a','a','a',''),

   sol:`Ребро куба ∛${a**3} = ${a}. Площадь поверхности 6·${a}² = ${6*a*a}.`};},
 ()=>{const [p,q,r,d]=pick(BX);const k=d<=9?ri(1,2):1;
  return{q:`Измерения прямоугольного параллелепипеда равны ${p*k}, ${q*k} и ${r*k}. Найдите длину его диагонали.`,a:d*k,fig:cuboid(String(p*k),String(q*k),String(r*k),'d'),
   th:E('Квадрат диагонали прямоугольного параллелепипеда равен сумме квадратов трёх его измерений: d² = a² + b² + c². Это теорема Пифагора, применённая дважды: сначала в основании, потом в треугольнике с высотой.',['Возведите каждое измерение в квадрат.','Сложите три числа.','Извлеките корень. Если подобраны хорошие числа, корень целый.'],'Складывают измерения без возведения в квадрат или берут диагональ грани вместо диагонали параллелепипеда.'),
   sol:`d = √(${(p*k)**2} + ${(q*k)**2} + ${(r*k)**2}) = √${(d*k)**2} = ${d*k}.`};},
 ()=>{const r=ri(2,9),h=ri(2,9);
  return{q:`Радиус основания цилиндра равен ${r}, высота равна ${h}. Найдите объём цилиндра, делённый на π.`,a:r*r*h,fig:cylinder('r = '+r,'h = '+h),
   th:E('Объём цилиндра равен площади основания, умноженной на высоту: V = πr²h. Когда просят «объём, делённый на π», множитель π просто пропадает.',['Возведите радиус в квадрат.','Умножьте на высоту.','π в ответ не входит.'],'Подставляют в формулу диаметр вместо радиуса или оставляют π в ответе.'),
   sol:`V = πr²h, поэтому V : π = ${r}²·${h} = ${r*r*h}.`};},
 ()=>{const h=3*ri(1,4),S=ri(2,12);const V=S*h/3;
  return{q:`Объём конуса равен ${V}, высота равна ${h}. Найдите площадь основания конуса.`,a:S,fig:cone('h = '+h,'S = ?'),
   th:E('Объём конуса равен трети произведения площади основания на высоту: V = ⅓·S·h. Это уравнение нужно решить относительно S.',['Выразите S: умножьте обе части на 3 и разделите на h, S = 3V : h.','Подставьте числа и вычислите.'],'Забывают про коэффициент ⅓ (получается ответ в три раза меньше нужного).'),
   sol:`V = ⅓·S·h, откуда S = 3V : h = ${3*V} : ${h} = ${S}.`};},
 ()=>{const r=3*ri(1,3);
  return{q:`Радиус шара равен ${r}. Найдите объём шара, делённый на π.`,a:4*r**3/3,fig:sphere('r = '+r),
   th:E('Объём шара: V = 4/3·π·r³. Когда просят объём, делённый на π, остаётся 4r³ : 3.',['Возведите радиус в куб.','Умножьте на 4 и разделите на 3. Радиус кратен 3, поэтому деление выполняется нацело.'],'Возводят радиус в квадрат (это формула площади сферы 4πr²).'),
   sol:`V = 4πr³/3, поэтому V : π = 4·${r**3} : 3 = ${4*r**3/3}.`};},
 ()=>{const a=ri(2,9),h=3*ri(1,4);
  return{q:`Основание пирамиды — квадрат со стороной ${a}, высота пирамиды равна ${h}. Найдите объём пирамиды.`,a:a*a*h/3,fig:pyramid('a = '+a,'h = '+h),
   th:E('Объём любой пирамиды равен трети произведения площади основания на высоту: V = ⅓·S·h. Основание — квадрат, значит S = a².',['Найдите площадь основания: a².','Умножьте на высоту и разделите на 3.'],'Забывают делить на 3 или берут боковое ребро вместо высоты.'),
   sol:`V = ⅓·${a}²·${h} = ${a*a*h/3}.`};},
 ()=>{const a=ri(2,8);
  return{q:`Диагональ куба равна ${a}√3. Найдите объём куба.`,a:a**3,fig:cuboid('a','a','a','a√3'),
   th:E('Диагональ куба с ребром a равна a√3: по формуле d² = a² + a² + a² = 3a². Значит, если диагональ записана как «число·√3», то это число и есть ребро.',['Сравните данную диагональ с a√3 и найдите ребро a.','Возведите ребро в куб.'],'Принимают диагональ за ребро и возводят в куб число вместе с корнем.'),
   sol:`Диагональ куба с ребром a равна a√3, значит ребро ${a}. V = ${a}³ = ${a**3}.`};}
]);

/* 4. Простая вероятность */
def(4,'Простая вероятность','Классическое определение вероятности',[
 ()=>{const n=pick([20,25,40,50,80,100,200]);const k=ri(3,n-3);
  return{q:`В классе ${n} учащихся (мальчиков: ${k}, девочек: ${n-k}). Один ученик выбирается случайно. Найдите вероятность того, что это окажется мальчик.`,a:k/n,fig:dots(n,k,'мальчики','девочки'),
   th:E('Классическое определение: вероятность события равна отношению числа благоприятных исходов m к числу всех равновозможных исходов n, P = m : n. Каждая точка на рисунке — один ученик.',['Определите, сколько всего равновозможных исходов (всего учащихся).','Определите, сколько из них благоприятных: здесь это мальчики.','Разделите m на n и запишите результат десятичной дробью.'],'В числитель ставят не тот набор: вопрос про мальчика, значит благоприятны именно мальчики.'),
   sol:`Благоприятных исходов ${k}, всего ${n}. P = ${k} : ${n} = ${N(k/n)}.`};},
 ()=>{if(Math.random()<.5){const w=ri(1,2);const e=3;
    return{q:`Монету бросают три раза. Найдите вероятность того, что орёл выпадет ровно ${w} ${w===1?'раз':'раза'}.`,a:e/8,fig:outcomes(),
     th:E('При трёх бросках монеты есть 2·2·2 = 8 равновозможных исходов: ООО, ООР, ОРО и так далее. Нужно выписать исходы с нужным числом орлов и разделить их количество на 8.',['Выпишите все 8 исходов (они на рисунке).','Отметьте те, где орёл выпал ровно столько раз, сколько требуется.','Разделите число отмеченных на 8.'],'Забывают, что ОРО и РОО — разные исходы, и считают благоприятных меньше, чем на самом деле.'),
     sol:`Всего 2³ = 8 равновозможных исходов, благоприятных ${e}. P = ${e} : 8 = ${N(e/8)}.`};}
  const m=pick([0,3]);return{q:`Монету бросают три раза. Найдите вероятность того, что орёл выпадет ${m===0?'ни разу':'все три раза'}.`,a:.125,fig:outcomes(),
   th:E('Всего 8 равновозможных исходов. Исход «все три раза орёл» (или «ни разу») единственный. Можно считать и по-другому: вероятность каждого броска 1/2, а независимые вероятности перемножаются: ½·½·½.',['Определите общее число исходов, 2³ = 8.','Найдите, сколько среди них нужных (один).','Разделите: 1 : 8.'],'Путают «ни разу» с «хотя бы один раз».'),
   sol:`Всего 8 равновозможных исходов, благоприятный один. P = 1 : 8 = 0,125.`};},
 ()=>{const n=pick([20,25,40,50,100]);const k=ri(3,Math.floor(n/2));
  return{q:`На экзамене ${n} билетов, в ${k} из них есть вопрос по теме «Логарифмы». Найдите вероятность того, что школьнику достанется билет с вопросом по логарифмам.`,a:k/n,fig:dots(n,k,'с логарифмами','остальные'),
   th:E('Все билеты равновозможны, поэтому вероятность вытянуть нужный билет равна доле таких билетов: P = m : n.',['Всего билетов n, нужных m.','Разделите m на n.','Запишите ответ десятичной дробью (проверьте: ответ не больше 1).'],'Делят в другом порядке (n : m). Вероятность не может быть больше 1.'),
   sol:`P = ${k} : ${n} = ${N(k/n)}.`};},
 ()=>{const p=ri(1,20)/100;
  return{q:`Вероятность того, что новая шариковая ручка пишет плохо, равна ${N(p)}. Покупатель выбирает одну ручку. Найдите вероятность того, что она пишет хорошо.`,a:1-p,fig:pbar(p,'пишет плохо','пишет хорошо'),
   th:E('События «пишет плохо» и «пишет хорошо» противоположны: одно из них обязательно происходит, и они не могут произойти вместе. Сумма их вероятностей равна 1, поэтому P(A̅) = 1 − P(A).',['Определите, что противоположно данному событию.','Вычтите данную вероятность из 1.'],'Ошибки в вычитании десятичных дробей: 1 − 0,07 = 0,93, а не 0,97.'),
   sol:`События «пишет плохо» и «пишет хорошо» противоположны: 1 − ${N(p)} = ${N(1-p)}.`};},
 ()=>{const n=pick([20,25,40,50,100]);const k=ri(2,Math.floor(n/2));
  return{q:`Фабрика выпускает сумки. В среднем из ${n} сумок ${k} имеют скрытые дефекты. Найдите вероятность того, что купленная сумка окажется без дефектов.`,a:(n-k)/n,fig:dots(n,k,'с дефектом','без дефекта'),
   th:E('Вероятность вычисляется как доля благоприятных исходов: P = m : n. Здесь благоприятны сумки без дефектов, их число равно n − k.',['Найдите число сумок без дефектов: из общего числа вычтите дефектные.','Разделите это число на общее число сумок.'],'Считают долю дефектных сумок, а нужна доля без дефектов.'),
   sol:`Сумок без дефектов ${n-k} из ${n}. P = ${n-k} : ${n} = ${N((n-k)/n)}.`};}
]);

/* 5. Сложная вероятность */
def(5,'Сложная вероятность','Независимые события, полная вероятность',[
 ()=>{const p=pick([.5,.6,.7,.8,.9]);const t=ri(0,3);
  const f=twoMachines;
  const tr=()=>tree('1-й выстрел',[{l:'попал',p:N(p),c:[{l:'попал',p:N(p)},{l:'промах',p:N(1-p)}]},{l:'промах',p:N(1-p),c:[{l:'попал',p:N(p)},{l:'промах',p:N(1-p)}]}]);
  const th=E('Если события независимы, вероятность того, что они произойдут вместе, равна произведению вероятностей: P(A и B) = P(A)·P(B). Вероятность промаха равна 1 − p. Дерево на рисунке показывает все варианты двух выстрелов; вероятность пути равна произведению чисел на его рёбрах.',['Запишите вероятности попадания и промаха.','Найдите на дереве нужные пути (для «ровно один раз» их два).','Перемножьте вероятности вдоль каждого пути и, если путей несколько, сложите результаты.'],'Для «ровно одного попадания» учитывают только один порядок (попал-промах) и забывают второй (промах-попал).');
  if(t===0)return{q:`Стрелок попадает в мишень с вероятностью ${N(p)}. Он делает два выстрела. Найдите вероятность того, что он попадёт оба раза.`,a:p*p,fig:tr(),th,sol:`Выстрелы независимы: ${N(p)}·${N(p)} = ${N(p*p)}.`};
  if(t===1)return{q:`Стрелок попадает в мишень с вероятностью ${N(p)}. Он делает два выстрела. Найдите вероятность того, что он промахнётся оба раза.`,a:(1-p)*(1-p),fig:tr(),th,sol:`Вероятность промаха ${N(1-p)}. Оба раза: ${N(1-p)}·${N(1-p)} = ${N((1-p)*(1-p))}.`};
  if(t===2)return{q:`Стрелок попадает в мишень с вероятностью ${N(p)}. Он делает два выстрела. Найдите вероятность того, что он попадёт ровно один раз.`,a:2*p*(1-p),fig:tr(),th,sol:`Два способа: попал-промах и промах-попал. 2·${N(p)}·${N(1-p)} = ${N(2*p*(1-p))}.`};
  return{q:`Стрелок попадает в мишень с вероятностью ${N(p)}. Он делает три выстрела. Найдите вероятность того, что он попадёт все три раза.`,a:p**3,fig:tr(),th:E('Выстрелы независимы, поэтому вероятности перемножаются: P = p·p·p = p³. Рисунок показывает схему для первых двух выстрелов, для третьего ветвление продолжается так же.',['Запишите вероятность одного попадания.','Возведите её в куб.'],'Складывают вероятности вместо того, чтобы перемножать.'),sol:`${N(p)}³ = ${N(p**3)}.`};},
 ()=>{const p=pick([.1,.2,.3,.4,.5]);const t=ri(0,2);
  const b=`В магазине стоят два платёжных автомата. Каждый из них неисправен с вероятностью ${N(p)} независимо от другого.`;
  const fig=twoMachines(p);
  if(t===0)return{q:b+` Найдите вероятность того, что хотя бы один автомат исправен.`,a:1-p*p,fig,
   th:E('Событие «хотя бы один» удобно считать через противоположное: P(хотя бы один) = 1 − P(ни одного). Противоположное событие здесь: оба автомата неисправны. Для независимых событий вероятности перемножаются.',['Найдите вероятность того, что оба автомата неисправны: p·p.','Вычтите результат из 1.'],'Считают «хотя бы один исправен» как 1 − p. Это вероятность только для одного автомата.'),
   sol:`Противоположное событие: оба неисправны, вероятность ${N(p)}² = ${N(p*p)}. Ответ: 1 − ${N(p*p)} = ${N(1-p*p)}.`};
  if(t===1)return{q:b+` Найдите вероятность того, что оба автомата исправны.`,a:(1-p)*(1-p),fig,
   th:E('Вероятность исправности одного автомата равна 1 − p. Автоматы работают независимо, поэтому вероятность того, что исправны оба, равна произведению: (1 − p)·(1 − p).',['Найдите вероятность исправности: 1 − p.','Возведите её в квадрат.'],'Путают вероятность неисправности и исправности.'),
   sol:`${N(1-p)}·${N(1-p)} = ${N((1-p)*(1-p))}.`};
  return{q:b+` Найдите вероятность того, что оба автомата неисправны.`,a:p*p,fig,
   th:E('Автоматы независимы, поэтому вероятность того, что неисправны оба, равна произведению вероятностей: p·p.',['Возьмите вероятность неисправности.','Умножьте её саму на себя.'],'Складывают вероятности вместо умножения.'),
   sol:`${N(p)}·${N(p)} = ${N(p*p)}.`};},
 ()=>{const f1v=pick([30,40,50,60,70]),f2v=100-f1v;const d1=ri(1,5),d2=ri(1,5);const r=(f1v*d1+f2v*d2)/10000;
  return{q:`Телефоны выпускают две фабрики. Первая выпускает ${f1v}% всей продукции, вторая — ${f2v}%. Доля брака у первой фабрики ${d1}%, у второй ${d2}%. Найдите вероятность того, что случайно купленный телефон окажется бракованным.`,a:r,
   fig:tree('телефон',[{l:'фабрика 1',p:N(f1v/100),c:[{l:'брак',p:N(d1/100)},{l:'норма',p:N(1-d1/100)}]},{l:'фабрика 2',p:N(f2v/100),c:[{l:'брак',p:N(d2/100)},{l:'норма',p:N(1-d2/100)}]}]),
   th:E('Формула полной вероятности: событие (брак) может произойти двумя несовместными способами, через каждую фабрику. P(брак) = P(фабрика 1)·P(брак | фабрика 1) + P(фабрика 2)·P(брак | фабрика 2). На дереве нужны два пути, ведущие в «брак».',['Переведите проценты в доли (30% = 0,3).','Для каждой фабрики перемножьте долю фабрики и долю брака у неё.','Сложите два произведения.'],'Складывают доли брака двух фабрик без учёта того, какую часть продукции выпускает каждая.'),
   sol:`Формула полной вероятности: ${N(f1v/100)}·${N(d1/100)} + ${N(f2v/100)}·${N(d2/100)} = ${N(r)}.`};},
 ()=>{const pd=pick([.04,.05,.1]),det=pick([.9,.95,.98]),fa=pick([.01,.02,.05]);const r=pd*det+(1-pd)*fa;
  return{q:`Вероятность того, что случайная деталь бракованная, равна ${N(pd)}. Автомат контроля бракует настоящий брак с вероятностью ${N(det)}, а исправную деталь ошибочно бракует с вероятностью ${N(fa)}. Найдите вероятность того, что случайная деталь будет забракована автоматом.`,a:r,
   fig:tree('деталь',[{l:'брак',p:N(pd),c:[{l:'забракована',p:N(det)},{l:'пропущена',p:N(1-det)}]},{l:'исправна',p:N(1-pd),c:[{l:'забракована',p:N(fa)},{l:'пропущена',p:N(1-fa)}]}]),
   th:E('Деталь либо бракованная, либо исправная: это две несовместные гипотезы. Событие «забракована» происходит при каждой из них со своей вероятностью. Полная вероятность: P = P(брак)·P(забракована | брак) + P(исправна)·P(забракована | исправна).',['Найдите вероятность того, что деталь исправна: 1 − P(брак).','Для каждой гипотезы перемножьте вероятность гипотезы и вероятность браковки при ней.','Сложите два произведения.'],'Забывают второе слагаемое: исправная деталь тоже может быть забракована по ошибке.'),
   sol:`${N(pd)}·${N(det)} + ${N(1-pd)}·${N(fa)} = ${N(pd*det)} + ${N((1-pd)*fa)} = ${N(r)}.`};}
]);

/* 6. Уравнения */
def(6,'Уравнения','Логарифмические, показательные, иррациональные',[
 ()=>{const [b,c]=pick([[2,3],[2,4],[2,5],[3,2],[3,3],[5,2],[4,2],[4,3],[7,2]]);const a=sgn()*ri(1,9);const x=b**c-a;
  return{q:`Решите уравнение ${lg(b)}(${xs(a)}) = ${c}.`,a:x,fig:plot({xmin:-a-2,xmax:Math.max(x+3,-a+6),ymin:-2,ymax:c+2,curves:[{f:t=>Math.log(t+a)/Math.log(b)}],hl:[{y:c,label:'y = '+c}]}),
   th:E('Определение логарифма: log_b(t) = c означает, что t = b^c, причём t > 0. Логарифм нужно «развернуть» в степень. На рисунке корень уравнения — абсцисса точки, где график логарифма пересекает горизонтальную прямую y = '+c+'.',['Запишите, что выражение под логарифмом равно основанию в степени c.','Вычислите степень.','Решите получившееся линейное уравнение.','Проверьте, что выражение под логарифмом положительно.'],'Забывают проверить область определения: под логарифмом должно быть положительное число.'),
   sol:`${xs(a)} = ${b}<sup>${c}</sup> = ${b**c}, откуда x = ${b**c} ${a<0?'+':'−'} ${Math.abs(a)} = ${x}.`};},
 ()=>{const [b,c]=pick([[2,3],[2,4],[2,5],[3,2],[3,3],[3,4],[5,2],[5,3],[7,2]]);const a=sgn()*ri(1,8);const Y=b**c;
  return{q:`Решите уравнение ${b}<sup>${xs(-a)}</sup> = ${b**c}.`,a:c+a,fig:plot({xmin:a-3,xmax:a+c+1.5,ymin:-Y*.1,ymax:Y*1.35,curves:[{f:t=>Math.pow(b,t-a)}],hl:[{y:Y,label:'y = '+Y}]}),
   th:E('Показательное уравнение решают, приведя обе части к одному основанию: если b^u = b^v (b > 0, b ≠ 1), то u = v. Число в правой части нужно представить как степень основания.',['Представьте число в правой части как степень того же основания.','Приравняйте показатели степеней.','Решите полученное линейное уравнение.'],'Приравнивают показатель к самому числу, не приведя к общему основанию.'),
   sol:`${b**c} = ${b}<sup>${c}</sup>, значит ${xs(-a)} = ${c}, x = ${c+a}.`};},
 ()=>{const a=sgn()*ri(1,9),c=ri(2,9);const x=c*c-a;
  return{q:`Решите уравнение √(${xs(a)}) = ${c}.`,a:x,fig:plot({xmin:-a-1,xmax:x+4,ymin:-1,ymax:c+2.5,curves:[{f:t=>Math.sqrt(t+a)}],hl:[{y:c,label:'y = '+c}]}),
   th:E('Чтобы избавиться от квадратного корня, обе части возводят в квадрат. Это можно делать, когда правая часть неотрицательна (иначе возможны посторонние корни). После решения корень проверяют подстановкой.',['Возведите обе части уравнения в квадрат.','Решите получившееся линейное уравнение.','Подставьте найденное значение в исходное уравнение и убедитесь, что равенство верно.'],'Забывают возвести в квадрат число справа: √(...) = 5 даёт 25, а не 5.'),
   sol:`Возводим в квадрат: ${xs(a)} = ${c*c}, x = ${x}.`};},
 ()=>{const a=ri(5,40),c=ri(2,6);const x=a-c*c;
  return{q:`Решите уравнение √(${a} − x) = ${c}.`,a:x,fig:plot({xmin:x-4,xmax:a+1,ymin:-1,ymax:c+2.5,curves:[{f:t=>Math.sqrt(a-t)}],hl:[{y:c,label:'y = '+c}]}),
   th:E('Возведите обе части в квадрат, чтобы убрать корень: из √(u) = c (c ≥ 0) следует u = c². Затем решите линейное уравнение относительно x и проверьте результат.',['Возведите обе части в квадрат.','Выразите x: переносите числа так, чтобы коэффициент при x стал положительным.','Сделайте проверку подстановкой.'],'Ошибка знака при переносе: из '+a+' − x = '+c*c+' следует x = '+a+' − '+c*c+', а не наоборот.'),
   sol:`Возводим в квадрат: ${a} − x = ${c*c}, x = ${x}.`};},
 ()=>{let p=ri(-9,9),q=ri(-9,9);while(p===q)q=ri(-9,9);const big=Math.random()<.5;const ans=big?Math.max(p,q):Math.min(p,q);
  return{q:`Решите уравнение ${poly([[1,'x²'],[-(p+q),'x'],[p*q,'']])} = 0. Если корней несколько, в ответе запишите ${big?'больший':'меньший'} из них.`,a:ans,fig:plot({xmin:Math.min(p,q)-3,xmax:Math.max(p,q)+3,curves:[{f:t=>(t-p)*(t-q)}],ticks:'x'}),
   th:E('Теорема Виета: корни x₁ и x₂ уравнения x² + bx + c = 0 удовлетворяют условиям x₁ + x₂ = −b и x₁·x₂ = c. Парабола пересекает ось x в корнях. Если подбор не получается, используйте дискриминант D = b² − 4c и формулу x = (−b ± √D) : 2.',['Выпишите сумму корней (число с противоположным знаком к среднему коэффициенту) и их произведение (свободный член).','Подберите два целых числа с такой суммой и произведением.','Выберите больший или меньший корень, как требует условие.'],'Берут сумму корней с тем же знаком, что и средний коэффициент, а надо с противоположным. Также читают условие невнимательно и записывают не тот корень.'),
   sol:`По теореме Виета корни равны ${N(p)} и ${N(q)}. Нужен ${big?'больший':'меньший'}: ${N(ans)}.`};},
 ()=>{const x=ri(-8,8),b=ri(-8,8);if(x+b===0)return T[5].gens[5]();const c=pick([2,3,4,5,-1,-2,-3]);const a=c*(x+b)-x;
  return{q:`Решите уравнение ${fr(xs(a),xs(b))} = ${N(c)}.`,a:x,fig:plot({xmin:-b-6,xmax:-b+6,ymin:c-7,ymax:c+7,curves:[{f:t=>(t+a)/(t+b)}],hl:[{y:c,label:'y = '+N(c)}],vl:[{x:-b,label:'x = '+N(-b)}],ticks:'xy'}),
   th:E('Дробь равна числу, когда числитель равен этому числу, умноженному на знаменатель: u/v = c ⇔ u = c·v (при v ≠ 0). На графике пунктирная вертикаль — значение x, при котором знаменатель обращается в нуль и функция не определена.',['Умножьте обе части на знаменатель (он не равен нулю).','Раскройте скобки и соберите слагаемые с x в одной части, числа — в другой.','Найдите x и проверьте, что знаменатель при нём не равен нулю.'],'Раскрывая скобки, умножают на число только первое слагаемое.'),
   sol:`${xs(a)} = ${N(c)}·(${xs(b)}). Решая линейное уравнение, получаем x = ${N(x)}. Знаменатель при этом не равен нулю.`};}
]);

/* 7. Преобразования выражений */
const LS=[[6,4,9,2],[6,2,18,2],[6,12,3,2],[10,4,25,2],[10,2,50,2],[10,20,5,2],[12,4,36,2],[12,16,9,2],[2,4,8,5],[3,27,3,4],[5,25,5,3],[2,16,2,5],[3,9,9,4]];
const LD=[[3,162,2,4],[2,96,3,5],[5,250,2,3],[6,432,2,3],[10,5000,5,3],[2,160,5,5],[3,54,2,3]];
const TG=[[3,4],[4,3]];
def(7,'Преобразования','Логарифмы, степени, корни, тригонометрия',[
 ()=>{const [b,p,q,k]=pick(LS);
  return{q:`Найдите значение выражения ${lg(b)} ${p} + ${lg(b)} ${q}.`,a:k,
   th:E('Сумма логарифмов с одинаковым основанием равна логарифму произведения: log_a x + log_a y = log_a(xy). Затем используется определение: log_a(a^k) = k.',['Объедините два логарифма в один: перемножьте числа под знаком логарифма.','Представьте полученное число как степень основания.','Ответ — показатель степени.'],'Складывают числа под логарифмом вместо умножения.'),
   sol:`Сумма логарифмов равна логарифму произведения: ${lg(b)}(${p}·${q}) = ${lg(b)} ${p*q} = ${k}.`};},
 ()=>{const [b,p,q,k]=pick(LD);
  return{q:`Найдите значение выражения ${lg(b)} ${p} − ${lg(b)} ${q}.`,a:k,
   th:E('Разность логарифмов с одинаковым основанием равна логарифму частного: log_a x − log_a y = log_a(x : y).',['Объедините логарифмы: разделите первое число на второе.','Представьте частное как степень основания.','Ответ — показатель степени.'],'Вычитают числа под логарифмом вместо деления.'),
   sol:`Разность логарифмов равна логарифму частного: ${lg(b)}(${p} : ${q}) = ${lg(b)} ${p/q} = ${k}.`};},
 ()=>{const b=pick([2,3,5]),c=ri(2,3),m=ri(2,9);
  return{q:`Найдите значение выражения ${b}<sup>${c} + ${lg(b)} ${m}</sup>.`,a:b**c*m,
   th:E('Свойство степени: a^(u + v) = a^u·a^v. Основное логарифмическое тождество: b^(log_b m) = m.',['Разделите степень с суммой в показателе на произведение двух степеней.','Вторую степень вычислите по основному логарифмическому тождеству.','Вычислите первую степень и перемножьте.'],'Пытаются вычислить логарифм по отдельности, хотя тождество сразу даёт число.'),
   sol:`${b}<sup>${c}</sup>·${b}<sup>${lg(b)} ${m}</sup> = ${b**c}·${m} = ${b**c*m}.`};},
 ()=>{const b=pick([2,3,5]),e=ri(1,3),p=ri(2,5),q=ri(2,4);const r=p*q-e;
  return{q:`Найдите значение выражения ${fr(`(${b}<sup>${p}</sup>)<sup>${q}</sup>`,`${b}<sup>${r}</sup>`)}.`,a:b**e,
   th:E('Свойства степеней: (a^m)^n = a^(m·n) и a^m : a^n = a^(m − n). Числа не нужно перемножать «в лоб»: достаточно работать с показателями.',['Упростите числитель: перемножьте показатели.','Разделите степени с одинаковым основанием: вычтите показатели.','Вычислите оставшуюся маленькую степень.'],'Складывают показатели при возведении степени в степень (надо умножать).'),
   sol:`Числитель равен ${b}<sup>${p*q}</sup>. Делим степени: ${b}<sup>${p*q} − ${r}</sup> = ${b}<sup>${e}</sup> = ${b**e}.`};},
 ()=>{if(Math.random()<.5){const m=ri(8,30),n=ri(2,m-1);
   return{q:`Найдите значение выражения (√${m} − √${n})(√${m} + √${n}).`,a:m-n,
    th:E('Формула разности квадратов: (a − b)(a + b) = a² − b². Квадрат корня из неотрицательного числа равен самому числу: (√m)² = m.',['Заметьте, что скобки образуют разность квадратов.','Возведите каждый корень в квадрат: получатся числа под корнями.','Вычтите.'],'Пытаются приближённо считать корни. Формула даёт точный целый ответ.'),
    sol:`Разность квадратов: ${m} − ${n} = ${m-n}.`};}
  const bs=pick([2,3,5,7]),s=ri(1,4),t=ri(1,4);
  return{q:`Найдите значение выражения √${bs*s*s}·√${bs*t*t}.`,a:bs*s*t,
   th:E('Корень из произведения равен произведению корней: √m·√n = √(mn). Удобно выносить множитель из-под корня: √(b·s²) = s√b.',['Вынесите множитель из-под каждого корня: каждое число имеет вид (число)·(квадрат).','Перемножьте внешние множители, а корни √b·√b = b.','Вычислите результат.'],'Складывают числа под корнями вместо умножения.'),
   sol:`√${bs*s*s} = ${s}√${bs}, √${bs*t*t} = ${t}√${bs}. Произведение: ${s*t}·${bs} = ${bs*s*t}.`};},
 ()=>{const [s,c]=pick(TG).map(v=>v/5);const t=ri(0,2);
  const thq=E('Основное тригонометрическое тождество: sin²α + cos²α = 1. Знак функции определяется четвертью, в которой лежит угол: в I четверти sin и cos положительны; во II sin положителен, cos отрицателен; в III оба отрицательны; в IV cos положителен, sin отрицателен. Тангенс равен sin : cos.',['Найдите модуль недостающей функции из тождества: |cos α| = √(1 − sin²α) или |sin α| = √(1 − cos²α).','По четверти определите знак.','Вычислите требуемое выражение.'],'Забывают определить знак по четверти и записывают положительное значение.');
  if(t===0){const k=pick([5,10]);return{q:`Найдите ${k}cos α, если sin α = ${N(s)} и α ∈ (0; π/2).`,a:k*c,fig:unitCircle(Math.round(Math.asin(s)*180/Math.PI),'I четверть: cos α > 0'),th:thq,sol:`cos α = √(1 − ${N(s)}²) = ${N(c)} (в первой четверти косинус положителен). Ответ: ${k}·${N(c)} = ${N(k*c)}.`};}
  if(t===1){const k=pick([5,10]);return{q:`Найдите ${k}cos α, если sin α = ${N(s)} и α ∈ (π/2; π).`,a:-k*c,fig:unitCircle(180-Math.round(Math.asin(s)*180/Math.PI),'II четверть: cos α < 0'),th:thq,sol:`|cos α| = √(1 − ${N(s)}²) = ${N(c)}. Во второй четверти косинус отрицателен: ${k}·(−${N(c)}) = ${N(-k*c)}.`};}
  const neg=Math.random()<.5;const ang=Math.round(Math.acos(.8)*180/Math.PI);return{q:`Найдите tg α, если cos α = 0,8 и α ∈ ${neg?'(3π/2; 2π)':'(0; π/2)'}.`,a:neg?-.75:.75,fig:unitCircle(neg?-ang:ang,neg?'IV четверть: sin α < 0':'I четверть: sin α > 0'),th:thq,sol:`|sin α| = √(1 − 0,8²) = 0,6, значит |tg α| = 0,6 : 0,8 = 0,75. ${neg?'В четвёртой четверти тангенс отрицателен: −0,75.':'В первой четверти тангенс положителен: 0,75.'}`};},
 ()=>{const t=ri(0,2);
  if(t===0){const k=ri(2,9);return{q:`Найдите значение выражения ${k}√3·tg 60°.`,a:3*k,fig:tri30(),
   th:E('Табличные значения: tg 60° = √3, tg 30° = 1/√3, sin 30° = 1/2, cos 30° = √3/2, sin 60° = √3/2, cos 60° = 1/2, sin 45° = cos 45° = √2/2. Их легко восстановить из треугольников на рисунке: в нём катеты 1 и √3, гипотенуза 2.',['Подставьте табличное значение тангенса.','Перемножьте: √3·√3 = 3.','Умножьте на оставшееся число.'],'Путают значения для 30° и 60°. Тангенс 60° — большое число (√3 ≈ 1,73).'),sol:`tg 60° = √3, поэтому ${k}√3·√3 = ${3*k}.`};}
  if(t===1){const k=ri(2,9);return{q:`Найдите значение выражения ${k}√2·sin 45°.`,a:k,fig:tri45(),
   th:E('В равнобедренном прямоугольном треугольнике катеты равны 1, гипотенуза √2, а острые углы по 45°. Поэтому sin 45° = cos 45° = 1/√2 = √2/2.',['Подставьте sin 45° = √2/2.','Перемножьте: √2·√2 = 2, затем разделите на 2.'],'Берут sin 45° = 1/2 (это значение для 30°).'),sol:`sin 45° = √2/2, поэтому ${k}√2·√2/2 = ${k}.`};}
  const k=2*ri(1,5);return{q:`Найдите значение выражения ${k}√3·cos 30°.`,a:3*k/2,fig:tri30(),
   th:E('В треугольнике 30°-60°-90° со сторонами 1, √3, 2 косинус 30° равен отношению прилежащего катета √3 к гипотенузе 2: cos 30° = √3/2.',['Подставьте cos 30° = √3/2.','Умножьте: √3·√3 = 3.','Разделите на 2.'],'Путают cos 30° = √3/2 и sin 30° = 1/2.'),sol:`cos 30° = √3/2, поэтому ${k}√3·√3/2 = ${3*k/2}.`};}
]);

/* 8. Производная */
def(8,'Производная','Касательная, скорость, первообразная',[
 ()=>{const x0=ri(1,5),b=ri(-9,9),c=ri(-10,10);const k=2*x0+b,m=c-x0*x0;const f=t=>t*t+b*t+c;
  return{q:`Прямая y = ${poly([[k,'x'],[m,'']])} является касательной к графику функции y = x² + bx${c?sg(c):''}. Найдите b, если абсцисса точки касания положительна.`,a:b,
   fig:plot({xmin:x0-4.5,xmax:x0+4.5,curves:[{f},{f:t=>k*t+m,cls:'sm'}],pts:[{x:x0,y:f(x0),label:'точка касания',dx:10,dy:18}],ticks:false}),
   th:E('Прямая касается параболы, когда у них ровно одна общая точка. Значит, уравнение «график = прямая» имеет один корень, и его дискриминант равен нулю. Другой способ: в точке касания совпадают значения функций и производная равна угловому коэффициенту прямой, f′(x₀) = k.',['Приравняйте x² + bx + c к kx + m и перенесите всё в одну часть.','Дискриминант полученного квадратного уравнения приравняйте к нулю.','Из условия «абсцисса точки касания положительна» выберите нужное значение b.'],'Не используют условие про положительную абсциссу и получают сразу два значения b. Из них подходит только одно.'),
   sol:`Приравниваем: x² + (b − ${N(k)})x + ${N(c-m)} = 0. Касание означает нулевой дискриминант: (b − ${N(k)})² = ${4*(c-m)}, откуда b − ${N(k)} = ±${2*x0}. Абсцисса точки касания x₀ = (${N(k)} − b) : 2 должна быть положительной, поэтому b = ${N(k)} − ${2*x0} = ${N(b)}.`};},
 ()=>{const a=ri(1,2),b=ri(-5,5),c=ri(-8,8),d=ri(-5,5),t0=ri(1,4);const v=3*a*t0*t0+2*b*t0+c;const f=t=>a*t**3+b*t*t+c*t+d;
  return{q:`Материальная точка движется прямолинейно по закону x(t) = ${poly([[a,'t³'],[b,'t²'],[c,'t'],[d,'']])} (x — в метрах, t — в секундах). Найдите скорость точки в момент времени t = ${t0} с. Ответ дайте в м/с.`,a:v,
   fig:plot({xmin:0,xmax:t0+2,curves:[{f}],vl:[{x:t0,label:'t = '+t0}],pts:[{x:t0,y:f(t0)}],xl:'t',yl:'x'}),
   th:E('Скорость — это производная координаты по времени: v(t) = x′(t). Правила: (tⁿ)′ = n·tⁿ⁻¹, производная постоянной равна 0, производная суммы — сумма производных. Геометрически скорость — наклон касательной к графику x(t).',['Найдите производную x′(t), дифференцируя слагаемые по отдельности.','Подставьте заданный момент времени в полученную формулу.','Вычислите, следя за знаками.'],'Подставляют время в формулу координаты x(t), а не в производную.'),
   sol:`v(t) = x′(t) = ${poly([[3*a,'t²'],[2*b,'t'],[c,'']])}. v(${t0}) = ${N(v)}.`};},
 ()=>{const a=ri(1,3),b=ri(-4,4),c=ri(-6,6),d=ri(-5,5),x0=ri(-2,3);const k=3*a*x0*x0+2*b*x0+c;const f=t=>a*t**3+b*t*t+c*t+d;
  return{q:`Найдите угловой коэффициент касательной к графику функции f(x) = ${poly([[a,'x³'],[b,'x²'],[c,'x'],[d,'']])} в точке с абсциссой x₀ = ${N(x0)}.`,a:k,
   fig:plot({xmin:x0-3,xmax:x0+3,curves:[{f}],vl:[{x:x0,label:'x₀ = '+N(x0)}],pts:[{x:x0,y:f(x0)}],ticks:'x'}),
   th:E('Геометрический смысл производной: значение f′(x₀) равно угловому коэффициенту касательной к графику функции в точке с абсциссой x₀. Производная многочлена: (xⁿ)′ = n·xⁿ⁻¹.',['Найдите f′(x), продифференцировав каждое слагаемое.','Подставьте x₀ в f′(x).','Вычислите значение, внимательно считая степени и знаки.'],'Подставляют x₀ в саму функцию f(x), а не в производную.'),
   sol:`f′(x) = ${poly([[3*a,'x²'],[2*b,'x'],[c,'']])}. Угловой коэффициент равен f′(${N(x0)}) = ${N(k)}.`};},
 ()=>{const a1=ri(1,3),b1=ri(-3,3),c=ri(-6,6),d=ri(-9,9),x0=ri(1,3);const F=a1*x0**3+b1*x0**2+c*x0+d;const f=t=>3*a1*t*t+2*b1*t+c;
  return{q:`Для функции f(x) = ${poly([[3*a1,'x²'],[2*b1,'x'],[c,'']])} найдите первообразную F(x), график которой проходит через точку (0; ${N(d)}). В ответе укажите F(${x0}).`,a:F,
   fig:plot({xmin:-1.5,xmax:x0+1.5,curves:[{f}],shade:[0,x0,f],ticks:'x',yl:'f(x)'}),
   th:E('Первообразная F(x) функции f(x) — такая функция, что F′(x) = f(x). Для степени: первообразная xⁿ равна xⁿ⁺¹ : (n + 1). Первообразная определена с точностью до постоянной C, которую находят из условия, что график проходит через заданную точку. Закрашенная площадь на рисунке равна F(x₀) − F(0).',['Найдите первообразную каждого слагаемого и добавьте C.','Подставьте x = 0 и условие F(0) = d, найдите C.','Подставьте нужное значение x в F(x).'],'Забывают добавить постоянную C или находят её, подставляя не ту точку.'),
   sol:`F(x) = ${poly([[a1,'x³'],[b1,'x²'],[c,'x'],[d,'']])} (постоянная найдена из условия F(0) = ${N(d)}). F(${x0}) = ${N(F)}.`};}
]);

/* 9. Прикладная задача */
const BL=[[.2,1.4],[.4,1.2],[.6,1.0],[.2,.6],[.4,.8],[.2,1.0],[.2,1.8],[.4,1.6],[.6,1.4]];
def(9,'Прикладная задача','Формулы из физики и экономики',[
 ()=>{const [t1,t2]=pick(BL);const h0=pick([1,1.2,1.5,1.6,2]);const v=Math.round(5*(t1+t2));const H=rnd(h0+5*t1*t2);
  const tend=(v+Math.sqrt(v*v+20*h0))/10;
  return{q:`Мяч бросили вертикально вверх. Высота мяча над землёй (в метрах) меняется по закону h(t) = ${N(h0)} + ${v}t − 5t², где t — время в секундах. Сколько секунд мяч будет находиться на высоте не менее ${N(H)} метра?`,a:rnd(t2-t1),
   fig:plot({xmin:0,xmax:Math.ceil(tend*10)/10,ymin:0,ymax:h0+v*v/20+.8,curves:[{f:t=>h0+v*t-5*t*t}],hl:[{y:H,label:'h = '+N(H)}],xl:'t, с',yl:'h, м'}),
   th:E('Условие «высота не менее H» означает неравенство h(t) ≥ H. Перенесите всё в одну часть: получится квадратное неравенство. Ветви параболы h(t) направлены вниз (коэффициент при t² равен −5), поэтому h ≥ H между корнями соответствующего уравнения. Время нахождения на этой высоте — разность большего и меньшего корней. На рисунке это отрезок, где кривая лежит выше пунктирной линии.',['Запишите неравенство h(t) ≥ H и приведите его к виду «квадратный трёхчлен ≤ 0».','Разделите на общий множитель, чтобы коэффициенты стали проще.','Найдите корни t₁ и t₂ (по теореме Виета или через дискриминант).','Ответ — t₂ − t₁.'],'Отвечают значением одного из корней, а не разностью корней.'),
   sol:`Решаем ${N(h0)} + ${v}t − 5t² ≥ ${N(H)}, то есть 5t² − ${v}t + ${N(rnd(H-h0))} ≤ 0. Корни: t = ${N(t1)} и t = ${N(t2)}. Мяч выше ${N(H)} м в течение ${N(t2)} − ${N(t1)} = ${N(rnd(t2-t1))} с.`};},
 ()=>{const p1=ri(2,6),p2=ri(p1+1,12),m=pick([1,2,5,10]);const k=m*(p1+p2),X=m*p1*p2;
  return{q:`Зависимость объёма спроса q (единиц в месяц) на продукцию предприятия от цены p (тыс. руб.) задаётся формулой q = ${k} − ${m===1?'':m}p. Выручка равна r(p) = q·p. Найдите наибольшую цену p, при которой месячная выручка составит не менее ${X} тыс. руб. Ответ дайте в тыс. руб.`,a:p2,
   fig:plot({xmin:0,xmax:k/m,ymin:0,ymax:m*(p1+p2)**2/4+X*.05+1,curves:[{f:t=>t*(k-m*t)}],hl:[{y:X,label:'r = '+X}],xl:'p',yl:'r'}),
   th:E('Выручка r(p) = p·q(p) — квадратичная функция цены, её график парабола с ветвями вниз. Условие «выручка не менее X» даёт неравенство r(p) ≥ X, которое выполняется между корнями уравнения r(p) = X. Наибольшая подходящая цена — больший корень.',['Подставьте q в формулу выручки и запишите неравенство r(p) ≥ X.','Приведите к виду «квадратный трёхчлен ≤ 0» и разделите на общий множитель.','Найдите корни и запишите промежуток.','Выберите наибольшее значение p из промежутка.'],'Решают неравенство с неправильным знаком и получают промежутки вне корней.'),
   sol:`p(${k} − ${m===1?'':m}p) ≥ ${X}, то есть ${poly([[m,'p²'],[-k,'p'],[X,'']])} ≤ 0. Корни ${p1} и ${p2}, значит p ∈ [${p1}; ${p2}]. Наибольшая цена ${p2}.`};},
 ()=>{const I=ri(2,9),R=ri(2,12);const P=I*I*R;
  return{q:`Мощность постоянного тока вычисляется по формуле P = I²R. При силе тока I = ${I} А мощность равна ${P} Вт. Найдите сопротивление R в омах.`,a:R,
   th:E('В прикладной задаче дана формула, в которую нужно подставить известные величины и выразить неизвестную. Здесь P = I²·R, значит R = P : I².',['Выпишите формулу и известные значения.','Выразите нужную величину (разделите обе части на I²).','Подставьте числа. Следите за тем, что I возводится в квадрат.'],'Делят на I, а не на I².'),
   sol:`R = P : I² = ${P} : ${I*I} = ${R}.`};},
 ()=>{const w=ri(2,9),R=ri(2,9);const A=w*w*R;
  return{q:`Центростремительное ускорение при движении по окружности вычисляется по формуле a = ω²R. Найдите радиус R (в метрах), если угловая скорость ω = ${w} с⁻¹, а ускорение a = ${A} м/с².`,a:R,
   th:E('Подставьте известные значения в формулу a = ω²R и выразите R: R = a : ω².',['Возведите угловую скорость в квадрат.','Разделите ускорение на полученное число.'],'Не возводят угловую скорость в квадрат.'),
   sol:`R = a : ω² = ${A} : ${w*w} = ${R}.`};},
 ()=>{const j=ri(-3,8);const C=5*j,F=9*j+32;
  return{q:`Температура по шкале Фаренгейта связана с температурой по шкале Цельсия формулой t<sub>F</sub> = 1,8·t<sub>C</sub> + 32. Сколько градусов по шкале Цельсия соответствует ${N(F)} градусам по шкале Фаренгейта?`,a:C,
   th:E('Это линейная формула. Чтобы выразить t_C, нужно «раздеть» уравнение: сначала вычесть 32, затем разделить на 1,8.',['Подставьте температуру по Фаренгейту в формулу.','Вычтите 32 из обеих частей.','Разделите результат на 1,8 (удобно умножить числитель и знаменатель на 10 или на 5 и разделить на 9).'],'Делят на 1,8, не вычтя сначала 32 (порядок действий важен).'),
   sol:`t<sub>C</sub> = (${N(F)} − 32) : 1,8 = ${N(F-32)} : 1,8 = ${N(C)}.`};}
]);

/* 10. Текстовая задача */
const PP=[[15,10,6],[30,20,12],[12,6,4],[24,8,6],[36,12,9],[45,30,18],[20,5,4],[60,40,24]];
const AV=[[40,60,48],[30,60,40],[60,90,72],[20,30,24],[50,75,60],[24,40,30]];
def(10,'Текстовая задача','Движение, работа, проценты',[
 ()=>{const c=pick([2,3,4,5]);const v=c+ri(2,12);const t1=ri(1,4),t2=ri(1,4);const d1=(v-c)*t1,d2=(v+c)*t2,Tt=t1+t2;
  return{q:`Моторная лодка прошла против течения реки ${d1} км и по течению ${d2} км, затратив на весь путь ${Tt} ч. Скорость течения реки равна ${c} км/ч. Найдите собственную скорость лодки (в км/ч).`,a:v,fig:figBoat(d1,d2,c),
   th:E('Время = расстояние : скорость. Против течения скорость лодки равна v − c, по течению v + c, где v — собственная скорость, c — скорость течения. Общее время — сумма времён на двух участках.',['Обозначьте собственную скорость за v (v > c).','Запишите время на каждом участке и составьте уравнение: сумма времён равна общему времени.','Решите уравнение. Часто быстрее подобрать v среди чисел, больших скорости течения, и проверить подстановкой.','Проверьте, что полученная скорость больше скорости течения.'],'Вместо времени подставляют расстояние или путают, на каком участке скорость v − c, а на каком v + c.'),
   sol:`Пусть собственная скорость v. Против течения лодка идёт со скоростью v − ${c}, по течению v + ${c}. Уравнение: ${d1}/(v − ${c}) + ${d2}/(v + ${c}) = ${Tt}. Его решение v = ${v}: ${d1}/${v-c} + ${d2}/${v+c} = ${t1} + ${t2} = ${Tt}.`};},
 ()=>{const [a,b,r]=pick(PP);
  return{q:`Первая труба наполняет бассейн за ${a} мин, а вторая — за ${b} мин. За сколько минут они наполнят бассейн, работая вместе?`,a:r,fig:figPipes(a,b),
   th:E('В задачах на работу весь объём принимают за 1. Если труба наполняет бассейн за t минут, то её производительность равна 1/t бассейна в минуту. Производительности при совместной работе складываются, а время равно 1 : (общая производительность).',['Запишите производительность каждой трубы: 1/a и 1/b.','Сложите производительности (приведите дроби к общему знаменателю).','Разделите 1 на сумму, чтобы получить время.'],'Складывают времена (a + b) или берут среднее. Складывать нужно именно производительности.'),
   sol:`За минуту первая наполняет 1/${a} бассейна, вторая 1/${b}. Вместе 1/${a} + 1/${b} = 1/${r}. Значит, нужно ${r} мин.`};},
 ()=>{let v1,v2,t,D;do{v1=5*ri(8,16);v2=5*ri(8,16);t=pick([2,2.5,3,4,5]);D=(v1+v2)*t;}while(!Number.isInteger(D));
  return{q:`Расстояние между городами A и B равно ${D} км. Из A в B выехал автомобиль со скоростью ${v1} км/ч. Одновременно ему навстречу из B выехал второй автомобиль со скоростью ${v2} км/ч. Через сколько часов автомобили встретятся?`,a:t,fig:figMeet(D,v1,v2),
   th:E('При движении навстречу друг другу расстояние между телами сокращается со скоростью, равной сумме скоростей (скорость сближения). Время встречи равно расстоянию, делённому на скорость сближения: t = S : (v₁ + v₂).',['Сложите скорости автомобилей.','Разделите расстояние на сумму скоростей.'],'Делят расстояние на одну скорость или на разность скоростей (это формула для погони).'),
   sol:`Скорость сближения ${v1} + ${v2} = ${v1+v2} км/ч. Время: ${D} : ${v1+v2} = ${N(t)} ч.`};},
 ()=>{let price,p1,p2,r;do{price=50*ri(10,40);p1=pick([10,20,25,30,40,50]);p2=pick([10,20,25,50]);r=price*(100+p1)*(100-p2)/10000;}while(Math.abs(r*100-Math.round(r*100))>1e-7);
  return{q:`Цена товара ${price} руб. Сначала её повысили на ${p1}%, а затем новую цену снизили на ${p2}%. Сколько рублей стоит товар после двух изменений?`,a:r,fig:figPercent(p1,p2),
   th:E('Увеличение на p% означает умножение на (1 + p/100), уменьшение на p% — умножение на (1 − p/100). Второй процент считается от новой цены, а не от первоначальной, поэтому проценты нельзя просто вычесть друг из друга.',['Найдите цену после повышения: умножьте на (1 + p₁/100).','Найдите цену после снижения: умножьте результат на (1 − p₂/100).'],'Считают, что повышение на 20% и снижение на 20% возвращают исходную цену. Это неверно: основа для расчёта меняется.'),
   sol:`После повышения: ${price}·${N(1+p1/100)} = ${N(price*(1+p1/100))}. После снижения: ${N(price*(1+p1/100))}·${N(1-p2/100)} = ${N(r)}.`};},
 ()=>{const [v1,v2,r]=pick(AV);
  return{q:`Первую половину пути автомобиль проехал со скоростью ${v1} км/ч, а вторую половину — со скоростью ${v2} км/ч. Найдите среднюю скорость автомобиля на всём пути (в км/ч).`,a:r,fig:figAvg(v1,v2),
   th:E('Средняя скорость равна всему пройденному пути, делённому на всё затраченное время, а не среднему арифметическому скоростей. Если обе половины пути одинаковы, длину можно взять любой: она сократится.',['Примите длину половины пути за S (или за удобное число, например за НОК скоростей).','Найдите время на каждой половине: S : v₁ и S : v₂.','Разделите весь путь 2S на сумму времён.'],'Берут среднее арифметическое скоростей (v₁ + v₂) : 2. Оно верно, только если одинаковы времена, а не расстояния.'),
   sol:`Пусть весь путь 2S. Время: S/${v1} + S/${v2}. Средняя скорость 2S : (S/${v1} + S/${v2}) = 2·${v1}·${v2} : (${v1} + ${v2}) = ${r}.`};}
]);

/* 11. Графики функций */
const HY={2:[1,2],3:[1,3],4:[1,2,4],6:[1,2,3,6],12:[1,2,3,4,6,12]};
def(11,'Графики функций','Линейная, квадратичная, обратная, показательная',[
 ()=>{let k=ri(-5,5);while(k===0)k=ri(-5,5);const b=ri(-9,9);const x1=ri(-4,0),x2=ri(1,4),x3=ri(-6,6);const f=t=>k*t+b;
  return{q:`График функции f(x) = kx + b проходит через точки (${x1}; ${N(f(x1))}) и (${x2}; ${N(f(x2))}). Найдите f(${N(x3)}).`,a:f(x3),
   fig:plot({xmin:-7,xmax:7,ymin:Math.min(f(-7),f(7))-3,ymax:Math.max(f(-7),f(7))+3,curves:[{f}],pts:[{x:x1,y:f(x1),label:'('+x1+'; '+N(f(x1))+')',dx:8,dy:-8},{x:x2,y:f(x2),label:'('+x2+'; '+N(f(x2))+')',dx:8,dy:-8}],vl:[{x:x3,label:'x = '+N(x3)}],ticks:false}),
   th:E('График линейной функции — прямая, она однозначно определяется двумя точками. Угловой коэффициент k = (y₂ − y₁) : (x₂ − x₁). Затем b находят подстановкой одной из точек в уравнение y = kx + b.',['Найдите k по двум точкам.','Подставьте координаты одной точки и найдите b.','Подставьте нужное значение x в f(x) = kx + b.'],'Ошибки в знаках при вычитании отрицательных координат. Проверьте результат подстановкой второй точки.'),
   sol:`Угловой коэффициент k = (${N(f(x2))} − (${N(f(x1))})) : (${x2} − (${x1})) = ${N(k)}, b = ${N(b)}. f(${N(x3)}) = ${N(f(x3))}.`};},
 ()=>{const m=ri(-5,5),n=ri(-9,9),x0=ri(-5,5);const r=(x0-m)**2+n;const f=t=>(t-m)**2+n;
  return{q:`График функции f(x) = x² + bx + c имеет вершину в точке (${N(m)}; ${N(n)}). Найдите f(${N(x0)}).`,a:r,
   fig:plot({xmin:Math.min(m,x0)-3,xmax:Math.max(m,x0)+3,curves:[{f}],pts:[{x:m,y:n,label:'вершина ('+N(m)+'; '+N(n)+')',dx:10,dy:18}],vl:[{x:x0,label:'x = '+N(x0)}],ticks:false}),
   th:E('Квадратичную функцию с вершиной (m; n) и старшим коэффициентом 1 можно записать как f(x) = (x − m)² + n. Это «вершинная» форма: m сдвигает параболу по x, n — по y. Тогда значение в любой точке получается подстановкой.',['Запишите f(x) = (x − m)² + n, подставив координаты вершины.','Подставьте нужное x.','Вычислите, аккуратно обращаясь со знаками.'],'Забывают, что в скобке стоит x − m: если вершина имеет абсциссу −3, то скобка (x + 3).'),
   sol:`Ветви параболы направлены вверх, коэффициент при x² равен 1, поэтому f(x) = (x − (${N(m)}))² + ${N(n)}. f(${N(x0)}) = ${N((x0-m)**2)} + ${N(n)} = ${N(r)}.`};},
 ()=>{const a=pick([2,3,4,6,12]);const ds=HY[a];const b=ri(-6,6);const x1=pick(ds)*sgn();let x2=pick(ds)*sgn();while(x2===x1)x2=pick(ds)*sgn();const x3=pick(ds)*sgn();
  const f=x=>a/x+b;
  return{q:`График функции f(x) = ${fr('a','x')} + b проходит через точки (${N(x1)}; ${N(f(x1))}) и (${N(x2)}; ${N(f(x2))}). Найдите f(${N(x3)}).`,a:f(x3),
   fig:plot({xmin:-7,xmax:7,ymin:b-9,ymax:b+9,curves:[{f}],pts:[{x:x1,y:f(x1),label:'('+N(x1)+'; '+N(f(x1))+')',dx:x1>0?8:-8,dy:-8},{x:x2,y:f(x2),label:'('+N(x2)+'; '+N(f(x2))+')',dx:x2>0?8:-8,dy:-8}],vl:[{x:x3,label:'x = '+N(x3)}],ticks:false}),
   th:E('Для функции f(x) = a/x + b две точки дают систему из двух уравнений с неизвестными a и b. Проще всего вычесть одно уравнение из другого: b сократится, и останется уравнение для a. График — гипербола, сдвинутая по вертикали на b.',['Запишите два уравнения: a/x₁ + b = y₁ и a/x₂ + b = y₂.','Вычтите их, найдите a.','Подставьте a в одно из уравнений и найдите b.','Подставьте нужное x в f(x).'],'Ошибки при вычитании дробей с отрицательными знаменателями. Сверьтесь подстановкой второй точки.'),
   sol:`Вычитаем равенства: ${N(f(x1))} − (${N(f(x2))}) = a(1/${N(x1)} − 1/(${N(x2)})), откуда a = ${a}, затем b = ${N(b)}. f(${N(x3)}) = ${N(f(x3))}.`};},
 ()=>{const bb=pick([2,3]);const a=ri(1,4);const x1=ri(0,2),x2=ri(x1+1,3),x3=ri(1,4);const f=x=>a*bb**x;
  return{q:`График функции f(x) = a·b<sup>x</sup> (a > 0, b > 0) проходит через точки (${x1}; ${f(x1)}) и (${x2}; ${f(x2)}). Найдите f(${x3}).`,a:f(x3),
   fig:plot({xmin:-1,xmax:Math.max(x2,x3)+1,ymin:-f(Math.max(x2,x3))*.08,ymax:f(Math.max(x2,x3)+1)*1.05,curves:[{f:t=>a*Math.pow(bb,t)}],pts:[{x:x1,y:f(x1),label:'('+x1+'; '+f(x1)+')',dx:-8,dy:-10},{x:x2,y:f(x2),label:'('+x2+'; '+f(x2)+')',dx:-8,dy:-10}],vl:[{x:x3,label:'x = '+x3}],ticks:false}),
   th:E('У показательной функции f(x) = a·b^x значения в точках x₁ и x₂ связаны так: f(x₂) : f(x₁) = b^(x₂ − x₁). Разделив одно равенство на другое, получают b, затем находят a.',['Разделите f(x₂) на f(x₁): получится степень b.','Найдите b (извлеките корень подходящей степени).','Из одной точки найдите a.','Подставьте нужное x.'],'Вычитают равенства вместо деления: для показательной функции работает деление.'),
