]);

/* 12. Наибольшее и наименьшее значение */
const algo=['Найдите производную функции.','Приравняйте производную к нулю и найдите критические точки.','Отберите те точки, которые лежат внутри заданного отрезка.','Вычислите значение функции в этих точках и на концах отрезка.','Из полученных чисел выберите наименьшее или наибольшее, как требует условие.'];
const algoErr='Забывают проверить концы отрезка или берут критическую точку, которая лежит вне отрезка.';
def(12,'Наибольшее и наименьшее','Экстремумы на отрезке',[
 ()=>{const k=ri(1,4),c=ri(-10,10);const mn=Math.random()<.5;
  const f=mn?t=>t**3-3*k*k*t+c:t=>-(t**3)+3*k*k*t+c;
  const th=E('Наибольшее и наименьшее значения непрерывной функции на отрезке достигаются либо в критических точках внутри отрезка (где производная равна нулю), либо на концах отрезка. Закрашенная полоса на рисунке — заданный отрезок.',algo,algoErr);
  const fig=plot({xmin:-1,xmax:2*k+1,curves:[{f}],band:[0,2*k],ticks:'x'});
  if(mn)return{q:`Найдите наименьшее значение функции y = ${poly([[1,'x³'],[-3*k*k,'x'],[c,'']])} на отрезке [0; ${2*k}].`,a:c-2*k**3,fig,th,sol:`y′ = 3x² − ${3*k*k} = 0 при x = ${k} (на отрезке). Сравниваем: y(0) = ${N(c)}, y(${k}) = ${N(c-2*k**3)}, y(${2*k}) = ${N(c+2*k**3)}. Наименьшее ${N(c-2*k**3)}.`};
  return{q:`Найдите наибольшее значение функции y = ${poly([[-1,'x³'],[3*k*k,'x'],[c,'']])} на отрезке [0; ${2*k}].`,a:c+2*k**3,fig,th,sol:`y′ = −3x² + ${3*k*k} = 0 при x = ${k} (на отрезке). Сравниваем: y(0) = ${N(c)}, y(${k}) = ${N(c+2*k**3)}, y(${2*k}) = ${N(c-2*k**3)}. Наибольшее ${N(c+2*k**3)}.`};},
 ()=>{const k=ri(2,8);const f=t=>t+k*k/t;
  return{q:`Найдите наименьшее значение функции y = x + ${fr(k*k,'x')} на отрезке [1; ${3*k}].`,a:2*k,fig:plot({xmin:.4,xmax:3*k+1,curves:[{f}],band:[1,3*k],ticks:'x'}),
   th:E('Производная суммы — сумма производных, (k/x)′ = −k/x². Знак производной показывает, где функция убывает или возрастает: если слева от критической точки производная отрицательна, а справа положительна, то это точка минимума.',['Найдите y′ = 1 − (число)/x².','Решите y′ = 0 на данном отрезке (x > 0).','Определите знаки производной слева и справа от критической точки.','Вычислите значение в точке минимума и сравните с концами, если нужно.'],'Берут отрицательный корень x = −k, который не лежит на отрезке.'),
   sol:`y′ = 1 − ${k*k}/x² = 0 при x = ${k}. Слева от ${k} производная отрицательна, справа положительна, значит ${k} — точка минимума. y(${k}) = ${k} + ${k} = ${2*k}.`};},
 ()=>{const p=sgn()*ri(1,6),q=ri(-10,20);const mn=Math.random()<.5;
  const th=E('График квадратичной функции — парабола. Если старший коэффициент положителен, у неё есть наименьшее значение в вершине, если отрицателен — наибольшее. Выделив полный квадрат, получаем y = ±(x − m)² + n: наименьшее (наибольшее) значение равно n, а вершина имеет абсциссу m.',['Выделите полный квадрат: x² − 2px = (x − p)² − p².','Определите знак квадратной скобки: при +(x − p)² есть минимум, при −(x − p)² есть максимум.','Постоянное слагаемое n и есть искомое значение.'],'Берут значение функции при x = p, а не значение n. Это одно и то же число, но нужно проверить вычисление.');
  if(mn)return{q:`Найдите наименьшее значение функции y = ${poly([[1,'x²'],[-2*p,'x'],[q,'']])}.`,a:q-p*p,fig:plot({xmin:p-4,xmax:p+4,curves:[{f:t=>t*t-2*p*t+q}],ticks:'x'}),th,sol:`Выделяем полный квадрат: y = (x − ${N(p)})² + ${N(q-p*p)}. Наименьшее значение ${N(q-p*p)}.`};
  return{q:`Найдите наибольшее значение функции y = ${poly([[-1,'x²'],[2*p,'x'],[q,'']])}.`,a:q+p*p,fig:plot({xmin:p-4,xmax:p+4,curves:[{f:t=>-t*t+2*p*t+q}],ticks:'x'}),th,sol:`Выделяем полный квадрат: y = −(x − ${N(p)})² + ${N(q+p*p)}. Наибольшее значение ${N(q+p*p)}.`};},
 ()=>{const a=ri(-5,8),k=pick([1,2,3,5]);const f=t=>k*(t-a)*Math.exp(t-a+1);
  return{q:`Найдите наименьшее значение функции y = ${k===1?'':k}(${xs(-a)})e<sup>${xs(1-a)}</sup> на отрезке [${N(a-3)}; ${N(a)}].`,a:-k,fig:plot({xmin:a-4,xmax:a+1,curves:[{f}],band:[a-3,a],ticks:'x'}),
   th:E('Производная произведения: (u·v)′ = u′·v + u·v′. Производная показательной функции e^(g(x)) равна e^(g(x))·g′(x). Множитель e^(...) всегда положителен, поэтому знак производной определяется оставшейся скобкой.',['Найдите производную по правилу произведения и вынесите e^(...) за скобку.','Приравняйте оставшийся множитель к нулю и найдите критическую точку.','Определите знак производной слева и справа: смена с «−» на «+» означает минимум.','Вычислите значение в точке минимума: e⁰ = 1.'],'Пытаются приравнять к нулю и показательный множитель. Он никогда не равен нулю.'),
   sol:`y′ = ${k===1?'':k+'·'}e<sup>${xs(1-a)}</sup>·(${xs(1-a)}) = 0 при x = ${N(a-1)}. Знак производной меняется с «−» на «+», это минимум. y(${N(a-1)}) = ${k===1?'':k+'·'}(−1)·e⁰ = ${-k}.`};},
 ()=>{const a=ri(2,9),b=ri(-8,8);const bs=b===0?'':(b<0?' − '+N(-b):' + '+N(b));const f=t=>a*Math.cos(t)+b;
  const th=E('Значения косинуса всегда лежат между −1 и 1: −1 ≤ cos x ≤ 1, причём оба значения достигаются. Поэтому наибольшее значение выражения a·cos x + b при a > 0 получается при cos x = 1, а наименьшее при cos x = −1.',['Определите знак множителя перед косинусом.','Подставьте в выражение cos x = 1 (для наибольшего) или cos x = −1 (для наименьшего).','Вычислите результат.'],'Подставляют не то крайнее значение косинуса. При отрицательном множителе перед косинусом ответы меняются местами.');
  if(Math.random()<.5)return{q:`Найдите наибольшее значение функции y = ${a}cos x${bs}.`,a:a+b,fig:plot({xmin:-7,xmax:7,curves:[{f}],ticks:'x'}),th,sol:`Наибольшее значение cos x равно 1, поэтому y<sub>max</sub> = ${a}·1${bs} = ${N(a+b)}.`};
  return{q:`Найдите наименьшее значение функции y = ${a}cos x${bs}.`,a:-a+b,fig:plot({xmin:-7,xmax:7,curves:[{f}],ticks:'x'}),th,sol:`Наименьшее значение cos x равно −1, поэтому y<sub>min</sub> = −${a}${bs} = ${N(-a+b)}.`};}
]);

/* ===================== ЧАСТЬ 2 (задания 13–19) ===================== */
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const piStr=k=>{if(k===0)return'0';const g=gcd(k,12);let n=k/g;const d=12/g;const m=n<0?'−':'';n=Math.abs(n);return m+(n===1?'π':n+'π')+(d===1?'':'/'+d);};
const fracS=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d;}return d===1?N(n):(n<0?'−':'')+Math.abs(n)+'/'+d;};
const rootsIn=(cls,A,B)=>{const r=new Set();cls.forEach(([b,s])=>{for(let n=-12;n<=12;n++){const v=b+s*n;if(v>=A&&v<=B)r.add(v);}});return[...r].sort((x,y)=>x-y);};
const ivStr=list=>list.map(r=>{
  if(r.a===r.b&&r.la&&r.lb)return'{'+N(r.a)+'}';
  const l=r.a===-Infinity?'(−∞':(r.la?'[':'(')+N(r.a);
  const rr=r.b===Infinity?'+∞)':N(r.b)+(r.lb?']':')');
  return l+'; '+rr;}).join(' ∪ ')||'∅';
const plK=n=>{const a=n%100,b=n%10;return a>=11&&a<=14?'корней':b===1?'корень':b>=2&&b<=4?'корня':'корней';};
const fx=a=>xs(-a);
const pf=a=>a===0?'x':'('+fx(a)+')';
const isect=(p1,p2,p3,p4)=>{const d=(p1[0]-p2[0])*(p3[1]-p4[1])-(p1[1]-p2[1])*(p3[0]-p4[0]);
  const t=((p1[0]-p3[0])*(p3[1]-p4[1])-(p1[1]-p3[1])*(p3[0]-p4[0]))/d;return[p1[0]+t*(p2[0]-p1[0]),p1[1]+t*(p2[1]-p1[1])];};

/* числовая прямая: o.min,o.max,o.ticks[{v,l}],o.shade[{a,b,la,lb}],o.dots[{v,l}] */
function nline(o){
  const W=400,H=118,ml=26,mr=26,y=68;const X=v=>ml+(v-o.min)/(o.max-o.min)*(W-ml-mr);
  let s=AR(ml-14,y,W-mr+14,y,'sk');
  (o.shade||[]).forEach(r=>{const a=Math.max(r.a,o.min),b=Math.min(r.b,o.max);s+=RC(X(a),y-10,Math.max(1,X(b)-X(a)),20,'fac');});
  (o.ticks||[]).forEach(t=>{s+=L(X(t.v),y-5,X(t.v),y+5,'sk')+TX(X(t.v),y+24,t.l,'middle','tm');});
  (o.shade||[]).forEach(r=>{
    if(isFinite(r.a)&&r.a>=o.min)s+=CI(X(r.a),y,5,r.la?'fa':'sk fsft');
    if(isFinite(r.b)&&r.b<=o.max)s+=CI(X(r.b),y,5,r.lb?'fa':'sk fsft');});
  (o.dots||[]).forEach((d,i)=>{s+=DTt(X(d.v),y,4.5,'fa')+TX(X(d.v),y-18-(i%2)*14,d.l,'middle','ta');});
  return SV(W,H,s);
}

/* ---------- 13: тригонометрия ---------- */
const crit13='<b>2 балла:</b> обоснованно получены верные ответы в обоих пунктах. <b>1 балл:</b> обоснованно получен верный ответ в пункте а или в пункте б (в том числе серии решений найдены верно, но при отборе корней допущена ошибка). <b>0 баллов:</b> остальные случаи.';
const th13a=E('Тригонометрическое уравнение сводят к простейшим: sin x = a, cos x = a, tg x = a. Нужные формулы: sin 2x = 2 sin x cos x, cos 2x = 1 − 2 sin²x = 2 cos²x − 1. Решения простейших: cos x = a даёт x = ±arccos a + 2πn, sin x = a даёт x = (−1)<sup>k</sup>·arcsin a + πk, n и k целые. Значения для углов 30°, 45°, 60° нужно знать наизусть. Произведение равно нулю, когда равен нулю хотя бы один множитель.',['Расписать sin 2x по формуле двойного угла и перенести всё в одну часть.','Вынести общий множитель sin x за скобки.','Приравнять к нулю каждый множитель, решить простейшие уравнения и записать серии решений.','Для пункта б) подставлять целые n в каждую серию и оставлять значения из отрезка; отдельно проверить концы отрезка. Удобно отметить найденные точки на числовой прямой, как на рисунке к решению.'],'Делят обе части на sin x. Так теряются корни, при которых sin x = 0. Общий множитель нужно выносить за скобку, а не сокращать.');
const th13b=E('Если в уравнении есть cos 2x и sin x, заменяют cos 2x = 1 − 2 sin²x и получают квадратное уравнение относительно t = sin x. Корни t нужно проверить: синус по модулю не больше 1, поэтому |t| > 1 не даёт решений. Для sin x = 1/2: x = π/6 + 2πn и x = 5π/6 + 2πn. Для sin x = −1/2: x = 7π/6 + 2πn и x = 11π/6 + 2πn.',['Заменить cos 2x по формуле 1 − 2 sin²x.','Ввести t = sin x и решить квадратное уравнение.','Отбросить корни t, по модулю большие 1.','Решить sin x = t, записать две серии решений.','Отобрать корни на отрезке подстановкой целых n и сверкой с концами отрезка.'],'Оставляют t = 2 или t = −2 и пытаются решать sin x = 2. Такое уравнение корней не имеет.');
function groupLists(cls,labels,A,B){return cls.map((c,i)=>{const r=rootsIn([c],A,B);return labels[i]+': '+(r.length?r.map(piStr).join('; '):'в отрезок не попадает');}).join('<br>');}
const gen13a=()=>{
  const c=pick([['√2',3,9,Math.SQRT2],['√3',2,10,Math.sqrt(3)],['1',4,8,1]]);const s=pick([1,-1]);const th=s>0?c[1]:c[2];
  const cs=c[0]==='1'?'':c[0]+'·';
  const eq=s>0?`sin 2x = ${cs}sin x`:`sin 2x + ${cs}sin x = 0`;
  const A=6*ri(-2,2),B=A+6*ri(3,4);
  const cls=[[0,12],[th,24],[-th,24]];const roots=rootsIn(cls,A,B);
  const cosT=(s<0?'−':'')+fr(c[0],2);
  return{q:`а) Решите уравнение ${eq}.<br>б) Найдите все корни этого уравнения, принадлежащие отрезку [${piStr(A)}; ${piStr(B)}].`,
   ans:`а) x = πn; x = ±${piStr(th)} + 2πn, где n ∈ ℤ.<br>б) ${roots.map(piStr).join('; ')}.`,
   sol:`<b>а)</b> Так как sin 2x = 2 sin x cos x, уравнение принимает вид 2 sin x cos x ${s>0?'−':'+'} ${cs}sin x = 0, то есть sin x·(2cos x ${s>0?'−':'+'} ${c[0]}) = 0.<br>Либо sin x = 0, откуда x = πn. Либо cos x = ${cosT}, откуда x = ±${piStr(th)} + 2πn, n ∈ ℤ.<br><b>б)</b> Отрезок [${piStr(A)}; ${piStr(B)}]. Отбираем корни по сериям:<br>${groupLists(cls,['x = πn','x = '+piStr(th)+' + 2πn','x = −'+piStr(th)+' + 2πn'],A,B)}<br>Итого ${roots.length} ${plK(roots.length)}: ${roots.map(piStr).join('; ')}.`,
   figSol:nline({min:A-3,max:B+3,ticks:[...Array((B-A)/6+1).keys()].map(i=>({v:A+6*i,l:piStr(A+6*i)})),shade:[{a:A,b:B,la:true,lb:true}],dots:roots.map(v=>({v,l:piStr(v)}))}),
   th:th13a,v:{t:13,f:x=>Math.sin(2*x)-s*c[3]*Math.sin(x),A,B,roots}};
};
const gen13b=()=>{
  const row=pick([[5,-3,1],[-5,-3,-1],[-3,1,1],[3,1,-1]]);const [p,q,sg0]=row;
  const cls=sg0>0?[[2,24],[10,24]]:[[14,24],[22,24]];
  const A=6*ri(-2,2),B=A+6*ri(3,4);const roots=rootsIn(cls,A,B);
  const eq=`cos 2x ${p<0?'−':'+'} ${Math.abs(p)} sin x ${q<0?'−':'+'} ${Math.abs(q)} = 0`;
  const D=p*p+8*(1+q),sq=Math.sqrt(D);const t1=fracS(p+sq,4),t2=fracS(p-sq,4);
  const good=sg0>0?'1/2':'−1/2';const bad=fracS(Math.abs(p+sq)>Math.abs(p-sq)?p+sq:p-sq,4);
  const v1=sg0>0?['π/6','5π/6']:['7π/6','11π/6'];
  return{q:`а) Решите уравнение ${eq}.<br>б) Найдите все корни этого уравнения, принадлежащие отрезку [${piStr(A)}; ${piStr(B)}].`,
   ans:`а) x = ${v1[0]} + 2πn; x = ${v1[1]} + 2πn, где n ∈ ℤ.<br>б) ${roots.length?roots.map(piStr).join('; '):'корней нет'}.`,
   sol:`<b>а)</b> Заменим cos 2x = 1 − 2 sin²x: 1 − 2 sin²x ${p<0?'−':'+'} ${Math.abs(p)} sin x ${q<0?'−':'+'} ${Math.abs(q)} = 0. Пусть t = sin x, тогда 2t² ${-p<0?'−':'+'} ${Math.abs(p)}t ${-(1+q)<0?'−':'+'} ${Math.abs(1+q)} = 0.<br>Дискриминант D = ${p*p} ${8*(1+q)<0?'−':'+'} ${Math.abs(8*(1+q))} = ${D}, корни t = (${N(p)} ± ${sq}) : 4, то есть t = ${t1} и t = ${t2}.<br>Значение t = ${bad} не подходит, так как |sin x| ≤ 1. Остаётся sin x = ${good}, откуда x = ${v1[0]} + 2πn или x = ${v1[1]} + 2πn, n ∈ ℤ.<br><b>б)</b> На отрезке [${piStr(A)}; ${piStr(B)}]:<br>${groupLists(cls,['x = '+v1[0]+' + 2πn','x = '+v1[1]+' + 2πn'],A,B)}<br>Ответ: ${roots.length?roots.map(piStr).join('; '):'корней нет'}.`,
   figSol:nline({min:A-3,max:B+3,ticks:[...Array((B-A)/6+1).keys()].map(i=>({v:A+6*i,l:piStr(A+6*i)})),shade:[{a:A,b:B,la:true,lb:true}],dots:roots.map(v=>({v,l:piStr(v)}))}),
   th:th13b,v:{t:13,f:x=>Math.cos(2*x)+p*Math.sin(x)+q,A,B,roots}};
};
def(13,'Уравнения','Тригонометрическое уравнение и отбор корней',[gen13a,gen13b]);

/* ---------- 14: стереометрия ---------- */
const VP={A:[40,190],B:[190,190],C:[260,140],D:[110,140],A1:[40,80],B1:[190,80],C1:[260,30],D1:[110,30]};
function cubeFig(o){
  o=o||{};const P=VP;let s=PG([P.A,P.B,P.B1,P.A1],'sk fsft')+PG([P.B,P.C,P.C1,P.B1],'sk fsft')+PG([P.A1,P.B1,P.C1,P.D1],'sk fsft');
  s+=L(...P.A,...P.D,'sm sd')+L(...P.D,...P.C,'sm sd')+L(...P.D,...P.D1,'sm sd');

function solveRat(numR,denR,wantNeg,strict){
  const crit=[...new Set([...numR,...denR])].sort((a,b)=>a-b);
  const f=x=>{let v=1;numR.forEach(r=>v*=x-r);denR.forEach(r=>v/=x-r);return v;};
  const items=[];const signs=[];
  for(let i=0;i<=crit.length;i++){
    const lo=i?crit[i-1]:-Infinity,hi=i<crit.length?crit[i]:Infinity;
    const x=lo===-Infinity?hi-1:hi===Infinity?lo+1:(lo+hi)/2;const fv=f(x);
    items.push({t:'g',lo,hi,ok:wantNeg?fv<0:fv>0});signs.push({lo,hi,pos:fv>0});
    if(i<crit.length){const isNum=numR.includes(crit[i])&&!denR.includes(crit[i]);items.push({t:'p',v:crit[i],ok:isNum&&!strict});}
  }
  const seg=[];let cur=null;
  items.forEach(it=>{
    if(!it.ok){if(cur){seg.push(cur);cur=null;}return;}
    if(it.t==='g'){if(cur){cur.b=it.hi;cur.lb=false;}else cur={a:it.lo,la:false,b:it.hi,lb:false};}
    else{if(cur){cur.b=it.v;cur.lb=true;}else cur={a:it.v,la:true,b:it.v,lb:true};}
  });
  if(cur)seg.push(cur);
  return{seg,signs,crit};
}

const th16d=E('Если долг на 15-е число каждый месяц уменьшается на одну и ту же сумму, то долги на 15-е число образуют арифметическую прогрессию: S, S·(1 − 1/n), S·(1 − 2/n), …, S/n. Переплата за месяц — это r% от долга на 15-е число предыдущего месяца. Сумма n членов арифметической прогрессии: n·(первый + последний) : 2.',['Выписать долги на 15-е число каждого месяца: это арифметическая прогрессия.','Найти сумму этих долгов: S·(n + 1) : 2.','Переплата равна r% от этой суммы.','Общая выплата = сумма кредита + переплата (или найти r из условия про переплату).'],'Считают проценты от всей суммы кредита в каждом месяце. Проценты начисляются на оставшийся долг, а он уменьшается.');

const crit18='<b>4 балла:</b> обоснованно получен верный ответ. <b>3 балла:</b> получен ответ, отличающийся от верного исключением или включением граничных значений параметра, либо ход решения верный, но допущена вычислительная ошибка. <b>2 балла:</b> верно найдены ключевые значения параметра, но промежутки выбраны неверно. <b>1 балл:</b> задача сведена к верной модели (например, выполнен верный график), но дальнейшего продвижения нет. <b>0 баллов:</b> остальные случаи.';
const th18p=E('Если уравнение раскладывается на множители, его корни выражаются через параметр. Тогда условие «ровно один корень на отрезке» превращается в условие на параметр: каждый корень принадлежит отрезку при a из некоторого промежутка. Нужно найти эти два промежутка и взять те значения a, при которых в отрезок попадает ровно один из корней: исключить точки, где попадают оба.',['Разложить левую часть на множители и найти корни через a.','Для каждого корня записать условие «корень лежит на отрезке» как неравенство для a.','Получить два числовых промежутка для a.','Выбрать значения a, лежащие ровно в одном из промежутков (симметрическая разность). Проверить граничные значения подстановкой.'],'Забывают исключить значения a, при которых в отрезок попадают сразу оба корня. Граничные значения всегда проверяйте подстановкой.');
const th18g=E('Уравнение вида |f(x)| = a удобно решать графически: число корней равно числу точек пересечения графика y = |f(x)| и горизонтальной прямой y = a. График строят по шагам: сначала для x ≥ 0 строят параболу x² − sx + c, потом отражают его влево (функция чётна, так как стоит |x|), потом отражают вниз лежащие части вверх (модуль). Число пересечений меняется в точках экстремумов и на оси: надо отдельно разобрать эти значения a.',['Построить y = x² − s·x + c при x ≥ 0 и найти нули и вершину.','Отразить график относительно оси y (чётность), затем поднять части ниже оси x (модуль).','Выписать характерные значения a: нули функции, значения в локальных максимумах и в точке x = 0.','Для каждого промежутка между ними посчитать число пересечений и выбрать нужные a.','Отдельно разобрать сами значения a в точках смены числа корней.'],'Пропускают значения a, при которых прямая проходит через вершину или через точку x = 0: там число корней отличается от соседних промежутков.');
const gen18p=()=>{
  const m=ri(1,3),p=ri(-4,2),q=p+ri(1,8);
  const J2=[p-m,q-m],J1=[p+m,q+m];let seg;
  if(q-p>=2*m)seg=[{a:p-m,b:p+m,la:true,lb:false},{a:q-m,b:q+m,la:false,lb:true}];else seg=[{a:J2[0],b:J2[1],la:true,lb:true},{a:J1[0],b:J1[1],la:true,lb:true}];
  const both=q-p>=2*m;
  return{q:`Найдите все значения параметра a, при каждом из которых уравнение x² − 2ax + a² − ${m*m} = 0 имеет ровно один корень на отрезке [${N(p)}; ${N(q)}].`,
   ans:`${ivStr(seg)}.`,
   sol:`Левая часть — полный квадрат минус ${m*m}: (x − a)² − ${m*m} = (x − a − ${m})(x − a + ${m}). Корни: x₁ = a − ${m} и x₂ = a + ${m}, они различны.<br>Корень x₁ лежит на [${N(p)}; ${N(q)}] при ${N(p)} ≤ a − ${m} ≤ ${N(q)}, то есть a ∈ [${N(p+m)}; ${N(q+m)}].<br>Корень x₂ лежит на отрезке при ${N(p)} ≤ a + ${m} ≤ ${N(q)}, то есть a ∈ [${N(p-m)}; ${N(q-m)}].<br>${both?`Длина отрезка ${N(q-p)} не меньше 2·${m}, поэтому промежутки пересекаются ${q-p===2*m?'в единственной точке a = '+N(p+m):'по [' +N(p+m)+'; '+N(q-m)+']'}, где в отрезок попадают оба корня. Нужны значения, принадлежащие ровно одному промежутку: a ∈ [${N(p-m)}; ${N(p+m)}) и a ∈ (${N(q-m)}; ${N(q+m)}].`:`Длина отрезка ${N(q-p)} меньше 2·${m}, поэтому промежутки не пересекаются, и оба корня сразу в отрезке быть не могут. Подходят значения из обоих промежутков.`}<br>Ответ: ${ivStr(seg)}.`,
   figSol:nline({min:p-m-2,max:q+m+2,ticks:[{v:p-m,l:N(p-m)},{v:p+m,l:N(p+m)},{v:q-m,l:N(q-m)},{v:q+m,l:N(q+m)}],shade:seg}),
   th:th18p,v:{t:18,kind:'one',m,p,q,seg}};
};
const gen18g=()=>{
  const [u,v]=pick([[1,3],[1,5],[2,4],[3,5],[2,6],[3,7],[4,6],[4,8]]);const s=u+v,c=u*v,h=((v-u)/2)**2;
  const k=pick([2,3,4,6,8]);
  const seg=k===2?[{a:c,b:Infinity,la:false,lb:false}]:k===3?[{a:c,b:c,la:true,lb:true}]:k===4?[{a:0,b:0,la:true,lb:true},{a:h,b:c,la:false,lb:false}]:k===6?[{a:h,b:h,la:true,lb:true}]:[{a:0,b:h,la:false,lb:false}];
  const kw={2:'два корня',3:'три корня',4:'четыре корня',6:'шесть корней',8:'восемь корней'}[k];
  const f=x=>Math.abs(x*x-s*Math.abs(x)+c);const xm=v+2;
  return{q:`Найдите все значения параметра a, при каждом из которых уравнение |x² − ${s}|x| + ${c}| = a имеет ровно ${kw}.`,
   ans:`${ivStr(seg)}.`,
   sol:`Построим график y = |x² − ${s}|x| + ${c}|. При x ≥ 0 это модуль параболы y = x² − ${s}x + ${c} = (x − ${u})(x − ${v}); вершина параболы в точке (${N(s/2)}; −${N(h)}), значит локальный максимум полученного графика равен ${N(h)} при |x| = ${N(s/2)}. Функция чётна, поэтому график симметричен относительно оси y; при x = 0 значение равно ${c}.<br>Число корней при разных a (по числу пересечений с прямой y = a):<br>a &lt; 0: корней нет; a = 0: 4 корня (x = ±${u}, ±${v}); 0 &lt; a &lt; ${N(h)}: 8 корней; a = ${N(h)}: 6 корней; ${N(h)} &lt; a &lt; ${c}: 4 корня; a = ${c}: 3 корня; a &gt; ${c}: 2 корня.<br>Нужно ровно ${kw}. Ответ: ${ivStr(seg)}.`,
   figSol:plot({xmin:-xm,xmax:xm,ymin:-1,ymax:Math.ceil(c*1.25),curves:[{f}],hl:[{y:h,label:'a = '+N(h)},{y:c,label:'a = '+c}],ticks:'xy'}),
   th:th18g,v:{t:18,kind:'cnt',s,c,h,k,seg}};
};
def(18,'Параметр','Корни на отрезке и графический метод',[gen18p,gen18g]);

/* ---------- 19: теория чисел ---------- */
const crit19='<b>4 балла:</b> верно получены все требуемые результаты и они обоснованы. <b>3 балла:</b> верно решены два пункта или решены все три пункта, но в одном допущена неточность в обосновании. <b>2 балла:</b> верно решён один пункт, либо верно приведён пример или оценка для последнего пункта. <b>1 балл:</b> получен какой-то верный промежуточный результат. <b>0 баллов:</b> остальные случаи.';
const th19s=E('В задачах про наборы чисел требуется оценка и пример. Сумма k различных натуральных чисел не меньше 1 + 2 + … + k = k(k + 1)/2 и не больше суммы k наибольших допустимых чисел. Любое целое значение между минимумом и максимумом достижимо: увеличивая одно число на 1 (если оно ещё не равно соседнему справа), меняем сумму ровно на 1. Среднее арифметическое набора равно сумме, делённой на k, поэтому его максимум достигается на наборе из k наибольших чисел.',['Найти наименьшую и наибольшую возможную сумму набора (суммы k наименьших и k наибольших допустимых чисел).','Решить пункты по оценкам: «может ли» значит попадает ли число между минимумом и максимумом.','Если число подходит, предъявить пример набора (сдвигать наибольшие числа вверх).','Количество различных сумм равно максимум − минимум + 1.'],'Забывают проверить, что числа в наборе различны, или называют ответ «да» без примера. В таких задачах пример обязателен.');
const th19d=E('Число кратно d, если оно равно d·m. У трёхзначных чисел m пробегает все целые значения от ⌈100/d⌉ до ⌊999/d⌋. Сумма цифр числа abc равна a + b + c. Задачу решают перебором с умом: перебирают кратные d, начиная с наименьшего (или с наибольшего), и считают сумму цифр, пока не найдётся нужное число. Для пункта «сколько всего» выписывают все подходящие числа.',['Выписать кратные d трёхзначные числа в нужном порядке.','Для каждого считать сумму цифр и сравнивать с заданной.','Остановиться на первом подходящем (для наименьшего и наибольшего).','Для подсчёта выписать все подходящие числа и пересчитать.'],'Пропускают числа при ручном переборе. Помогает запись в виде таблицы «число — сумма цифр».');
const digSum=x=>String(x).split('').reduce((a,b)=>a+ +b,0);
const gen19s=()=>{
  const k=ri(4,8),top=ri(k+5,25);const mn=k*(k+1)/2,mx=k*(2*top-k+1)/2;
  const inR=Math.random()<.6;const S0=inR?ri(mn,mx):(Math.random()<.5?mn-ri(1,3):mx+ri(1,3));
  const yes=S0>=mn&&S0<=mx;let ex=null;
  if(yes){let D=S0-mn;ex=[];for(let i=1;i<=k;i++)ex.push(i);for(let i=k-1;i>=0&&D>0;i--){const g=Math.min(D,top-k);ex[i]+=g;D-=g;}}
  const avg=mx/k;
  return{q:`Набор состоит из ${k} различных натуральных чисел, каждое из которых не превосходит ${top}.<br>а) Может ли сумма чисел набора равняться ${S0}?<br>б) Найдите наибольшее возможное среднее арифметическое чисел набора.<br>в) Сколько различных значений может принимать сумма чисел набора?`,
   ans:`а) ${yes?'Да, может':'Нет, не может'}.<br>б) ${N(avg)}.<br>в) ${mx-mn+1}.`,
   sol:`<b>Оценки суммы.</b> Наименьшая возможная сумма — у набора 1, 2, …, ${k}: ${mn}. Наибольшая — у набора ${top-k+1}, …, ${top}: (${top-k+1} + ${top})·${k} : 2 = ${mx}.<br><b>а)</b> ${yes?`Число ${S0} лежит между ${mn} и ${mx}, значит такая сумма возможна. Пример: ${ex.join(', ')}. Числа различны, не превосходят ${top}, их сумма равна ${S0}.`:`Число ${S0} ${S0<mn?`меньше наименьшей возможной суммы ${mn}`:`больше наибольшей возможной суммы ${mx}`}, поэтому такой суммы быть не может.`}<br><b>б)</b> Среднее арифметическое набора равно сумме, делённой на ${k}, и наибольшее при наибольшей сумме: ${mx} : ${k} = ${N(avg)}.<br><b>в)</b> Минимальная сумма ${mn}, максимальная ${mx}. Любое целое значение между ними достижимо: если набор не состоит из наибольших допустимых чисел, то хотя бы одно число можно увеличить на 1, сохранив различие чисел, и сумма изменится ровно на 1. Значит, возможны все целые значения от ${mn} до ${mx}, их ${mx} − ${mn} + 1 = ${mx-mn+1}.`,
   th:th19s,v:{t:19,kind:'set',k,top,S0,yes,ex,mn,mx,avg,cnt:mx-mn+1}};
};
const gen19d=()=>{
  let d,s,list;let tries=0;do{d=pick([7,11,13,17,19,23,29]);s=ri(9,24);list=[];for(let x=Math.ceil(100/d)*d;x<1000;x+=d)if(digSum(x)===s)list.push(x);tries++;}while(list.length<3&&tries<400);
  const first=Math.ceil(100/d)*d,last=Math.floor(999/d)*d;
  const trace=(from,step)=>{const out=[];for(let x=from;x>=100&&x<=999;x+=step){out.push(x);if(digSum(x)===s)break;}
    return out.length>12?out.slice(0,5).map(x=>`${x} (${digSum(x)})`).join(', ')+', …, '+out.slice(-3).map(x=>`${x} (${digSum(x)})`).join(', '):out.map(x=>`${x} (${digSum(x)})`).join(', ');};
  const mn=list[0],mx=list[list.length-1];
  return{q:`Рассматриваются трёхзначные натуральные числа, кратные ${d}, сумма цифр которых равна ${s}.<br>а) Найдите наименьшее такое число.<br>б) Найдите наибольшее такое число.<br>в) Сколько всего таких чисел?`,
   ans:`а) ${mn}.<br>б) ${mx}.<br>в) ${list.length}.`,
   sol:`Трёхзначные числа, кратные ${d}, — это ${d}·m при m от ${first/d} до ${last/d} (от ${first} до ${last}). Для каждого проверяем сумму цифр (в скобках после числа).<br><b>а)</b> Идём от наименьшего вверх: ${trace(first,d)}. Первое число с суммой цифр ${s}: ${mn}.<br><b>б)</b> Идём от наибольшего вниз: ${trace(last,-d)}. Первое число с суммой цифр ${s}: ${mx}.<br><b>в)</b> Просматриваем все числа, кратные ${d}, от ${first} до ${last} (их ${(last-first)/d+1}), и отбираем те, у которых сумма цифр равна ${s}: ${list.join(', ')}. Всего ${list.length}.`,
   th:th19d,v:{t:19,kind:'dig',d,s,mn,mx,cnt:list.length}};
};
def(19,'Теория чисел','Оценка, пример, перебор',[gen19s,gen19d]);

<script id="ui">
const KEY='ege-profile-trainer-v1';
function loadStore(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.t)return r;}catch(e){}return{t:{}};}
let store=loadStore();
function saveStore(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function pushH(s,v){s.h=s.h||[];s.h.push(Math.round(v*100)/100);if(s.h.length>10)s.h=s.h.slice(-10);}
function rec(n,ok){const s=store.t[n]||(store.t[n]={d:0,o:0});s.d++;if(ok)s.o++;pushH(s,ok?1:0);saveStore();}
function rec2(n,pts,max){const s=store.t[n]||(store.t[n]={d:0,o:0});s.d++;s.p=(s.p||0)+pts;s.m=(s.m||0)+max;pushH(s,max?pts/max:0);saveStore();}

function parse(s){const t=String(s).trim().replace(/\s+/g,'').replace(',','.').replace(/[−–—]/g,'-');return /^-?\d+(\.\d+)?$/.test(t)?parseFloat(t):NaN;}
const same=(x,y)=>Math.abs(x-y)<1e-7;
const FALLBACK=n=>E('Разберите условие, выпишите известные величины и нужные формулы, затем подставьте числа.',['Выпишите, что дано и что нужно найти.','Вспомните формулу или свойство для этого типа задач.','Подставьте числа и вычислите.'],'');
function make(n,prev){const g=T[n-1].gens;let r;for(let i=0;i<8;i++){r=pick(g)();if(r.q!==prev)break;}if(r.a!==undefined)r.a=rnd(r.a);r.n=n;if(!r.th)r.th=FALLBACK(n);return r;}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const plB=n=>{const b=n%10,a=n%100;return a>=11&&a<=14?'баллов':b===1?'балл':b>=2&&b<=4?'балла':'баллов';};

const app=document.getElementById('app');
let S={view:'home'};
let resetArmed=false,resetTimer=null;

function figHtml(c){return c.fig?`<div class="figbox">${c.fig}</div>`:'';}
function expPanel(c,allowSol){
  const showSol=allowSol&&!S.done;
  return `<div>
    <button class="btn ghost small" data-act="exp" aria-expanded="${S.expOpen?'true':'false'}" aria-controls="exp">${S.expOpen?'Скрыть объяснение':'Объяснение'}</button>
    <div class="exp" id="exp" ${S.expOpen?'':'hidden'} style="margin-top:12px">${c.th}
      ${showSol?`<div class="tools"><button class="btn ghost small" data-act="showsol">Показать решение этой задачи</button></div><div class="sol" id="solbox" ${S.solOpen?'':'hidden'} style="margin-top:12px"><span class="tag">Решение</span>${c.sol}</div>`:''}
    </div></div>`;
}
function curScore(){return S.view==='variant'?S.scs[S.i]:S.sc;}
function p2Block(c,t){
  const sc=curScore();const has=sc!==null&&sc!==undefined;
  let h='<div class="paper">Решите задачу на бумаге, как на экзамене: запишите ход решения и ответ. Потом сверьтесь.</div>';
  if(S.rev===0)h+='<div class="ansrow"><button class="btn" data-act="rev1">Показать ответ</button></div>';
  if(S.rev>=1)h+=`<div class="ansbox"><span class="tag">Ответ</span>${c.ans}</div>`;
  if(S.rev===1)h+='<div class="ansrow"><button class="btn ghost" data-act="rev2">Показать полное решение</button></div>';
  if(S.rev>=2){
    h+=`<div class="sol"><span class="tag">Полное решение</span>${c.sol}</div>${c.figSol?`<div class="figbox">${c.figSol}</div>`:''}
    <div class="rubric"><span class="tag" style="display:block;margin-bottom:4px">Критерии (упрощённые, по образцу ФИПИ)</span>${t.crit}</div>
    <div><span class="alab">Сколько баллов вы себе поставите? Максимум ${t.max}</span>
    <div class="scorebtns" style="margin-top:8px">${[...Array(t.max+1).keys()].map(k=>`<button class="sbtn" data-act="score" data-v="${k}" aria-pressed="${sc===k?'true':'false'}" ${has?'disabled':''}>${k}</button>`).join('')}</div></div>`;
  }
  return h;
}
function tile(t){
  const s=store.t[t.n];let pct=0,stat='ещё не решали';
  if(t.p2){if(s&&s.m){pct=Math.round(s.p/s.m*100);stat=`набрано ${s.p} из ${s.m} ${plB(s.m)}`;}}
  else if(s&&s.d){pct=Math.round(s.o/s.d*100);stat=`верно ${s.o} из ${s.d}`;}
  return `<button class="tile" data-act="topic" data-n="${t.n}">
      <span class="row"><span class="num">${t.n}</span><span class="name">${t.name}</span>${t.p2?`<span class="pts">до ${t.max} ${plB(t.max)}</span>`:''}</span>
      <span class="meta">${t.hint}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      <span class="stat">${stat}</span>
    </button>`;
}

function home(){
  let d=0,o=0,d2=0,p=0,m=0;T.forEach(t=>{const s=store.t[t.n];if(!s)return;if(t.p2){d2+=s.d;p+=s.p||0;m+=s.m||0;}else{d+=s.d;o+=s.o;}});
  const acc=d?Math.round(o/d*100)+'%':'—';
  app.innerHTML=`
  ${tabs('trainer')}
  <header>

function result(){
  const rows=S.items.map((c,k)=>{const t=T[c.n-1];
    if(t.p2){return{c,t,p2:true,pts:S.scs[k]||0,max:t.max};}
    const v=parse(S.ans[k]||'');const ok=!isNaN(v)&&same(v,c.a);return{c,t,ok,raw:S.ans[k]||'',pts:ok?1:0,max:1};});
  const got=rows.reduce((a,r)=>a+r.pts,0),mx=rows.reduce((a,r)=>a+r.max,0);

  <p class="lead" style="margin-top:8px">Это первичные баллы.${hasP2?' Баллы за часть 2 вы ставили себе сами, поэтому итог приблизительный.':''} Перевод в 100-балльную шкалу меняется каждый год, он здесь не считается.</p></header>

    const cls=r.p2?(r.pts===r.max?'ok':r.pts===0?'bad':'mid'):(r.ok?'ok':'bad');

      <div class="sol"><span class="tag">${r.p2?'Полное решение':'Решение'}</span>${r.c.sol}</div>

/* ---------- Вкладка «Прогресс» ---------- */
function saveRun(){
  let g=0,a=0,b=0,m=0;
  S.items.forEach((it,k)=>{const t=T[it.n-1];
    if(t.p2){const v=S.scs[k]||0;b+=v;g+=v;m+=t.max;}
    else{const v=parse(S.ans[k]||'');if(!isNaN(v)&&same(v,it.a)){a++;g++;}m+=1;}});
  store.runs=store.runs||[];store.runs.push({k:S.kind,ts:Date.now(),g,m,a,b});
  if(store.runs.length>200)store.runs=store.runs.slice(-200);saveStore();
}
function tabs(active){
  return `<div class="tabs" role="tablist" aria-label="Разделы">
    <button class="tab" role="tab" data-act="tab" data-tab="trainer" aria-selected="${active==='trainer'?'true':'false'}">Тренажёр</button>
    <button class="tab" role="tab" data-act="tab" data-tab="progress" aria-selected="${active==='progress'?'true':'false'}">Прогресс</button>
  </div>`;
}
const LVN={good:['✓','освоено'],mid:['◐','в процессе'],weak:['!','слабое место'],none:['–','не начато']};
const lvOf=p=>p>=80?'good':p>=50?'mid':'weak';
function taskStat(t){
  const s=store.t[t.n];if(!s)return null;
  if(t.p2){if(!s.m)return null;return{att:s.d,pct:Math.round(s.p/s.m*100),txt:`${s.p} из ${s.m} ${plB(s.m)}`,h:s.h||[]};}
  if(!s.d)return null;return{att:s.d,pct:Math.round(s.o/s.d*100),txt:`верно ${s.o} из ${s.d}`,h:s.h||[]};
}
function spark(h){
  const n=10,bw=5,gap=2,H=24,W=n*(bw+gap)-gap;let r='';const cnt=Math.min(h.length,n);
  for(let k=0;k<n;k++){const idx=h.length-n+k,x=k*(bw+gap);
    if(idx<0){r+=`<rect class="sp-n" x="${x}" y="${H-2}" width="${bw}" height="2" rx="1"/>`;continue;}
    const v=h[idx],hh=Math.max(3,Math.round(v*H));
    r+=`<rect class="sp-${lvOf(v*100)}" x="${x}" y="${H-hh}" width="${bw}" height="${hh}" rx="1.5"/>`;}
  const lab=h.slice(-n).map(v=>Math.round(v*100)+'%').join(', ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Последние ${cnt} попыток: ${lab}"><title>Последние ${cnt} попыток: ${lab}</title>${r}</svg>`;
}
function prow(t){
  const st=taskStat(t);const lv=st?lvOf(st.pct):'none';const [ic,lab]=LVN[lv];
  return `<div class="prow">
    <span class="num sm">${t.n}</span>
    <div class="pmid">
      <div class="ptop"><span class="name">${t.name}</span><span class="pill lv-${lv}">${ic} ${lab}</span></div>
      <div class="bar"><i class="b-${lv}" style="width:${st?st.pct:0}%"></i></div>
      <span class="stat">${st?`${st.txt} · ${st.pct}% · попыток: ${st.att}`:'ещё не решали'}</span>
    </div>
    ${st?spark(st.h):''}
  </div>`;
}
function fmtDate(ts){try{return new Date(ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function roundTop(x,y,w,h,r){
  if(h<=0)return '';r=Math.min(r,h,w/2);
  return `M${f1(x)} ${f1(y+h)}V${f1(y+r)}Q${f1(x)} ${f1(y)} ${f1(x+r)} ${f1(y)}H${f1(x+w-r)}Q${f1(x+w)} ${f1(y)} ${f1(x+w)} ${f1(y+r)}V${f1(y+h)}Z`;
}
function runChart(runs){
  const last=runs.slice(-12),n=last.length,off=runs.length-n;
  const W=400,H=200,ml=32,mr=10,mt=18,mb=28,pw=W-ml-mr,ph=H-mt-mb;
  const Y=v=>mt+ph-v/32*ph;const slot=pw/Math.max(n,6),bw=Math.min(34,slot*.62);
  const best=Math.max(...last.map(r=>r.g)),lastIdx=n-1,bestIdx=last.map(r=>r.g).lastIndexOf(best);
  let g='';
  [0,8,16,24,32].forEach(v=>{g+=`<line class="${v===0?'pax':v===32?'pmax':'pg'}" x1="${ml}" y1="${f1(Y(v))}" x2="${W-mr}" y2="${f1(Y(v))}"/>`;});
  [0,16,32].forEach(v=>{g+=`<text x="${ml-6}" y="${f1(Y(v)+4)}" text-anchor="end">${v}</text>`;});
  g+=`<text x="${W-mr}" y="${f1(Y(32)-5)}" text-anchor="end">максимум 32</text>`;
  last.forEach((r,i)=>{
    const x=ml+slot*i+(slot-bw)/2,y1=Y(r.a),y2=Y(r.a+r.b);
    const num=off+i+1;
    const tip=`Вариант №${num}, ${fmtDate(r.ts)}: ${r.g} из ${r.m} (часть 1: ${r.a} из 12, часть 2: ${r.b} из 20)`;
    let bars='';
    if(r.a>0)bars+=r.b>0?`<rect class="s1" x="${f1(x)}" y="${f1(y1)}" width="${f1(bw)}" height="${f1(Y(0)-y1)}"/>`:`<path class="s1" d="${roundTop(x,y1,bw,Y(0)-y1,4)}"/>`;
    if(r.b>0){const top=y2,h2=Math.max(0,(r.a>0?y1-2:Y(0))-top);bars+=`<path class="s2" d="${roundTop(x,top,bw,h2,4)}"/>`;}
    const lbl=(i===lastIdx||i===bestIdx)?`<text class="tv" x="${f1(x+bw/2)}" y="${f1(y2-5)}" text-anchor="middle">${r.g}</text>`:'';
    g+=`<g class="bargrp"><title>${tip}</title><rect class="hit" x="${f1(ml+slot*i)}" y="${mt}" width="${f1(slot)}" height="${ph}"/>${bars}${lbl}<text x="${f1(x+bw/2)}" y="${H-8}" text-anchor="middle">№${num}</text></g>`;
  });
  return `<svg class="pc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Баллы за последние ${n} полных вариантов, максимум 32">${g}</svg>`;
}
function fullBlock(runs){
  if(!runs.length)return `<div class="empty"><b>Пока нет результатов.</b> Пройдите полный вариант на 19 заданий. После него здесь появятся баллы за каждую попытку, график и динамика. История ведётся с момента добавления этой вкладки.<div class="ansrow" style="margin-top:12px"><button class="btn" data-act="variant" data-kind="full">Решить полный вариант</button></div></div>`;
  const n=runs.length,lastR=runs[n-1],best=Math.max(...runs.map(r=>r.g)),avg=runs.reduce((a,r)=>a+r.g,0)/n;
  const d=n>1?lastR.g-runs[n-2].g:null;
  const rows=runs.slice(-10).reverse().map((r,i)=>`<tr><td>№${n-i}</td><td>${fmtDate(r.ts)}</td><td class="tot">${r.g} из ${r.m}</td><td>${r.a} из 12</td><td>${r.b} из 20</td></tr>`).join('');
  return `<div class="summary"><span>Вариантов решено: <b>${n}</b></span><span>Лучший: <b>${best}</b> из 32</span><span>Последний: <b>${lastR.g}</b> из 32${d===null?'':` (${d>0?'+':d<0?'−':'±'}${Math.abs(d)} к прошлому)`}</span><span>Среднее: <b>${N(Math.round(avg*10)/10)}</b></span></div>
  <div class="chartbox">${runChart(runs)}
    <div class="legend"><span><i class="sw s1"></i>Часть 1, до 12</span><span><i class="sw s2"></i>Часть 2, до 20 (самооценка)</span></div>
  </div>
  <div class="tblwrap"><table class="rtable"><thead><tr><th>Попытка</th><th>Дата</th><th>Итого</th><th>Часть 1</th><th>Часть 2</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="hint">Показаны последние 10 попыток, на графике до 12. Баллы за часть 2 вы ставите себе сами.</p>`;
}
function progress(){
  const rows=T.map(t=>({t,st:taskStat(t)}));
  const started=rows.filter(r=>r.st).length;
  const weak=rows.filter(r=>r.st&&r.st.att>=2&&r.st.pct<50).sort((a,b)=>a.st.pct-b.st.pct).slice(0,3);
  const runs=(store.runs||[]).filter(r=>r.k==='full');
  const p1=rows.filter(r=>!r.t.p2),p2=rows.filter(r=>r.t.p2);
  app.innerHTML=`${tabs('progress')}
  <header><div class="tag">Прогресс</div><h1>Как идёт подготовка</h1>
  <p class="lead">Сверху результаты по каждому заданию, ниже история полных вариантов.</p></header>
  <div class="summary"><span>Начато заданий: <b>${started}</b> из 19</span>${weak.length?`<span>Слабые места: <b>${weak.map(r=>'№'+r.t.n).join(', ')}</b></span>`:''}</div>
  <div class="sec"><h2>По заданиям</h2><span>Доля верных ответов (часть 1) и набранных баллов (часть 2) за все попытки. Столбики справа — последние 10 попыток, самая свежая справа.</span></div>
  <div class="legend"><span>✓ освоено: от 80%</span><span>◐ в процессе: 50–79%</span><span>! слабое место: ниже 50%</span></div>
  <div class="plist"><div class="pgroup">Часть 1 · ответ проверяется автоматически</div>${p1.map(r=>prow(r.t)).join('')}<div class="pgroup">Часть 2 · баллы по самооценке</div>${p2.map(r=>prow(r.t)).join('')}</div>
  <div class="sec"><h2>Полный вариант</h2><span>19 заданий, до 32 баллов.</span></div>
  ${fullBlock(runs)}`;
}

function render(){({home,practice,variant,result,progress})[S.view]();}
function go(s){S=s;render();window.scrollTo(0,0);}

function check(){
  const el=document.getElementById('ans');const raw=el.value;const v=parse(raw);
  if(isNaN(v)){S.msg='Введите число: целое или конечную десятичную дробь.';render();return;}
  S.msg='';const ok=same(v,S.cur.a);S.done=true;S.tot++;if(ok)S.ok++;S.res={ok,raw};rec(S.n,ok);render();
}
function nextQ(){S.cur=make(S.n,S.cur.q);S.done=false;S.res=null;S.msg='';S.expOpen=false;S.solOpen=false;S.rev=0;S.sc=null;render();window.scrollTo(0,0);}
function vnext(){
  const c=S.items[S.i],t=T[c.n-1];
  if(t.p2){if(S.scs[S.i]===null||S.scs[S.i]===undefined)return;}
  else{const el=document.getElementById('ans');if(el)S.ans[S.i]=el.value;}
  if(S.i<S.items.length-1){S.i++;S.expOpen=false;S.rev=0;render();window.scrollTo(0,0);}
  else{S.items.forEach((it,k)=>{const tt=T[it.n-1];if(tt.p2)rec2(it.n,S.scs[k]||0,tt.max);else{const v=parse(S.ans[k]||'');rec(it.n,!isNaN(v)&&same(v,it.a));}});saveRun();S.view='result';render();window.scrollTo(0,0);}
}
function giveScore(k){
  if(S.view==='variant'){if(S.scs[S.i]!==null&&S.scs[S.i]!==undefined)return;S.scs[S.i]=k;}
  else{if(S.sc!==null&&S.sc!==undefined)return;const t=T[S.n-1];S.sc=k;S.pts+=k;S.ptsMax+=t.max;rec2(S.n,k,t.max);}
  render();
}
function toggleExp(b){
  S.expOpen=!S.expOpen;const p=document.getElementById('exp');if(p)p.hidden=!S.expOpen;
  b.setAttribute('aria-expanded',S.expOpen?'true':'false');b.textContent=S.expOpen?'Скрыть объяснение':'Объяснение';
}
function showSol(b){S.solOpen=true;const x=document.getElementById('solbox');if(x)x.hidden=false;b.hidden=true;}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='home'){resetArmed=false;go({view:'home'});}
  else if(a==='topic'){const n=+b.dataset.n;go({view:'practice',n,ok:0,tot:0,pts:0,ptsMax:0,cur:make(n),done:false,res:null,msg:'',expOpen:false,solOpen:false,rev:0,sc:null});}
  else if(a==='variant'){const kind=b.dataset.kind||'full';const list=T.filter(t=>kind==='p1'?!t.p2:kind==='p2'?t.p2:true);
    go({view:'variant',kind,i:0,items:list.map(t=>make(t.n)),ans:[],scs:list.map(()=>null),expOpen:false,rev:0});}
  else if(a==='tab'){resetArmed=false;go({view:b.dataset.tab==='progress'?'progress':'home'});}
  else if(a==='check')check();
  else if(a==='next')nextQ();
  else if(a==='vnext')vnext();
  else if(a==='exp')toggleExp(b);
  else if(a==='showsol')showSol(b);
  else if(a==='rev1'){S.rev=1;render();}
  else if(a==='rev2'){S.rev=2;render();}
  else if(a==='score')giveScore(+b.dataset.v);
  else if(a==='reset'){
    if(resetArmed){store={t:{},runs:[]};saveStore();resetArmed=false;clearTimeout(resetTimer);render();}
    else{resetArmed=true;render();resetTimer=setTimeout(()=>{resetArmed=false;if(S.view==='home')render();},4000);}
  }
});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id!=='ans')return;
  if(S.view==='practice'){e.preventDefault();S.done?nextQ():check();}
  else if(S.view==='variant'){e.preventDefault();vnext();}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S.view==='practice'&&S.done&&document.activeElement===document.body){nextQ();}});

render();
</script>
